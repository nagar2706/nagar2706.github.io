      ([...S.scheds.values()].some(s => s.month === addMonths(mk, -1)) ? '<button class="btn" data-act="sched-copy" type="button">Copy ' + monthLabel(addMonths(mk, -1)) + '</button>' : "") + '</div></div>';
  } else {
    const kpi = (l, v, s) => '<div class="kpi"><div class="kpi-l">' + l + '</div><div class="kpi-v">' + v + '</div><div class="kpi-s">' + s + '</div></div>';
    h += '<div class="kpi-row">' + kpi("Scheduled", n0(tq), rows.length + " lines") + kpi("Dispatched", n0(ts), fmtPct(pct(ts, tq)) + " of schedule") + kpi("Due by today", n0(td), ts >= td ? "on pace" : n0(td - ts) + " behind") + kpi("Balance", n0(Math.max(0, tq - ts)), "to dispatch this month") + '</div>';
    h += '<div class="meter ' + (ts >= td ? "" : "amber") + '" style="margin-top:14px" role="img" aria-label="' + fmtPct(pct(ts, tq)) + ' dispatched"><i style="width:' + clamp(pct(ts, tq), 0, 100) + '%"></i><span class="pace" style="left:' + clamp(pct(td, tq), 0, 100) + '%"></span></div><div class="hint">Marker = due by today</div>';
  }
  h += '</section>';
  if (rows.length){
    // mobile cards
    h += '<section class="span-12 m-only">' + rows.map(r => {
      const st = SCHED_ST[r.status];
      return '<button class="card s-' + (r.status === "short" ? "bad" : r.status === "ok" || r.status === "done" ? "ok" : "warn") + '" style="margin-bottom:8px" data-act="sched-edit" data-id="' + esc(r.id) + '" type="button"><div class="c-top"><div style="min-width:0"><div class="c-id">' + esc(partyName(S, r.cust)) + '</div><div class="c-title">' + esc(compPN(S, r.comp)) + ' <span class="hi" style="font-size:12.5px">' + esc(compName(S, r.comp)) + '</span></div></div>' + badge(st.cls, st.en) + '</div>' +
        '<div class="meter ' + (r.status === "short" ? "red" : r.status === "ok" || r.status === "done" ? "" : "amber") + '" style="height:7px;margin:10px 0 6px"><i style="width:' + clamp(pct(r.sent, r.qty), 0, 100) + '%"></i><span class="pace" style="left:' + clamp(pct(r.due, r.qty), 0, 100) + '%"></span></div>' +
        '<div class="c-sub">' + n0(r.sent) + ' / ' + n0(r.qty) + ' dispatched · due ' + n0(r.due) + '</div><div class="c-foot"><span>FG ' + n0(r.fg) + '</span><span>Inspection ' + n0(r.insp) + '</span><span>Outside ' + n0(r.out) + '</span><span>Press shop ' + n0(r.plant) + '</span>' + (r.monthShort ? '<span style="color:#f08a7c">Not yet started ' + n0(r.monthShort) + '</span>' : "") + '</div></button>';
    }).join("") + '<button class="btn btn-block" data-act="sched-new" type="button">' + ic("plus") + 'Add schedule line</button></section>';
    // desktop table
    h += '<section class="panel span-12 d-only"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Customer</th><th>Part</th><th class="r">Schedule</th><th class="r">Due today</th><th class="r">Dispatched</th><th>Progress</th><th class="r">FG</th><th class="r">Insp</th><th class="r">Outside</th><th class="r">Press</th><th class="r">To start</th><th>Status</th></tr></thead><tbody>' +
      rows.map(r => { const st = SCHED_ST[r.status];
        return '<tr class="click" data-act="sched-edit" data-id="' + esc(r.id) + '"><td>' + esc(partyName(S, r.cust)) + '</td><td><b>' + esc(compPN(S, r.comp)) + '</b><div class="faint" style="font-size:11.5px">' + esc(compName(S, r.comp)) + '</div></td><td class="r">' + n0(r.qty) + '</td><td class="r">' + n0(r.due) + '</td><td class="r">' + n0(r.sent) + '</td>' +
          '<td style="min-width:120px"><div class="meter ' + (r.status === "short" ? "red" : r.status === "ok" || r.status === "done" ? "" : "amber") + '" style="height:7px;margin-top:5px"><i style="width:' + clamp(pct(r.sent, r.qty), 0, 100) + '%"></i><span class="pace" style="left:' + clamp(pct(r.due, r.qty), 0, 100) + '%"></span></div>' + (r.weeks ? '<div class="faint" style="font-size:10.5px;margin-top:4px">wk ' + r.weeks.map((w, i) => w ? n0(r.doneW[i]) + "/" + compact(w) : "").filter(Boolean).join(" · ") + '</div>' : "") + '</td>' +
          '<td class="r">' + n0(r.fg) + '</td><td class="r">' + n0(r.insp) + '</td><td class="r">' + n0(r.out) + '</td><td class="r">' + n0(r.plant) + '</td><td class="r">' + (r.monthShort ? '<span style="color:#f08a7c">' + n0(r.monthShort) + '</span>' : "–") + '</td><td>' + badge(st.cls, st.en) + '</td></tr>'; }).join("") + '</tbody></table></div><div class="hint">“To start” = balance not yet covered by FG or WIP → needs blanking. Click a row to edit.</div></section>';
  }
  // dispatches of the month
  const disp = S.disp.filter(d => d.date.slice(0, 7) === mk).slice().reverse();
  h += '<section class="panel span-12"><div class="ph"><h2>Dispatches in ' + monthLabel(mk) + '<span class="hi">डिस्पैच</span></h2><span class="ph-sub">' + n0(sum(disp, d => d.qty)) + ' pcs</span></div>' +
    (disp.length ? disp.slice(0, 60).map(d => '<button class="lrow" data-act="ev" data-id="' + esc(d.id) + '" type="button"><span class="l-ico" style="color:var(--st-fg)">' + ic("disp") + '</span><span class="l-main"><span class="l-t" style="display:block">' + esc(compPN(S, d.comp)) + ' <span class="hi" style="font-size:12px">' + esc(partyName(S, d.cust)) + '</span></span><span class="l-s" style="display:block">Inv ' + esc(d.inv || "—") + ' · ' + fmtDayKey(d.date) + (d.veh ? " · " + esc(d.veh) : "") + '</span></span><span class="l-r">' + n0(d.qty) + '<small>pcs</small></span></button>').join("") : '<div class="empty">No dispatches this month.</div>') + '</section></div>';
  return h;
}

/* ---- 08-forms.js ---- */
/* =====================================================================================
   ENTRY FORMS — one per shop-floor step. Each validates against what is actually
   available (coil balance, qty waiting at that step, FG) before saving an event.
   ===================================================================================== */
const GRADES = ["CRCA IS513 CR2", "CRCA IS513 CR4", "HRPO", "HR IS2062", "GI", "GP", "SS 304", "SS 409", "Spring steel CK67", "EN8", "MS wire", "HB wire", "Spring steel wire"];

/* ---------- pickers ---------- */
function compItems(S, filter){
  return [...S.comps.values()].filter(c => c.active !== false && (!filter || filter(c)))
    .sort((a, b) => String(a.partNo).localeCompare(String(b.partNo), undefined, {numeric:true}))
    .map(c => ({v:c.id, t:(c.partNo || "—") + " · " + (c.name || ""), s:[partyName(S, c.cust), specLabel(c), (c.route || []).map(r => r.op).join(" › ")].filter(Boolean).join(" · "), kw:c.name}));
}
function pickComp(cur, filter, cb, emptyMsg){
  pick({title:"Choose part", hi:"पार्ट चुनें", items:compItems(STATE, filter), value:cur, empty:emptyMsg || "No parts set up for this step", emptyHi:"More → Parts में पार्ट व रूट जोड़ें", onPick:it => cb(it.v)});
}
function setupText(S, su){
  if (!su) return "";
  const c = S.comps.get(su.comp);
  return compPN(S, su.comp) + " · " + (c ? stepName({route:c.route}, su.step) : "") + (su.die ? " · die " + su.die : "");
}
function pickMachine(cur, cb){
  const S = STATE;
  const items = machines().map(m => ({v:m.toolNo, t:m.toolNo + " · " + (m.toolName || ""), s:S.mc[m.toolNo] ? "Set up: " + setupText(S, S.mc[m.toolNo]) : "No setup recorded", b:mcBadge(m)}));
  pick({title:"Machine", hi:"मशीन", items, value:cur, add:"Type machine no.", onAdd:async () => { const v = await dialog({title:"Machine no.", input:{ph:"e.g. PM-07", value:cur || ""}}); if (v && v.trim()) cb(v.trim()); },
    empty:TOOLS.err && !isDemo() ? "PM Tracker not reachable: " + TOOLS.err : "No machines in PM Tracker", onPick:it => cb(it.v)});
}
function pickDie(partNo, cur, cb){
  const pn = norm(partNo), ds = dies();
  const mine = ds.filter(d => pn && norm(d.partNo) === pn), rest = ds.filter(d => !(pn && norm(d.partNo) === pn));
  const it = (d, g) => ({v:d.toolNo, t:d.toolNo + " · " + (d.toolName || ""), s:[d.partNo, d.partName, toolPM(d).text].filter(Boolean).join(" · "), b:pmBadge(d), g});
  pick({title:"Die", hi:"डाई", items:mine.map(d => it(d, "Dies for " + partNo)).concat(rest.map(d => it(d, "Other dies"))), value:cur, add:"No die / type die no.",
    onAdd:async () => { const v = await dialog({title:"Die no.", msg:"Leave empty if no die is used.", input:{ph:"e.g. 1016", value:cur || ""}}); if (v != null) cb(v.trim()); }, onPick:x => cb(x.v)});
}
function pickParty(roles, cur, cb, title){
  const S = STATE;
  const ps = [...S.parties.values()].filter(p => !roles || (p.roles || []).some(r => roles.includes(r))).sort((a, b) => a.name.localeCompare(b.name));
  pick({title:title || "Choose", items:ps.map(p => ({v:p.id, t:p.name, s:(p.roles || []).map(r => ROLES[r] ? ROLES[r].en : r).join(", ")})), value:cur,
    add:"Add new " + (title || "party").toLowerCase(), empty:"None added yet",
    onAdd:async () => {
      const name = await dialog({title:"New " + (title || "party").toLowerCase(), input:{ph:"Name"}, ok:"Add"});
      if (!name || !name.trim()) return;
      const ex = [...STATE.parties.values()].find(p => norm(p.name) === norm(name));
      if (ex){ cb(ex.id); return; }
      const id = uid("pa"); addEvent("party.save", {id, name:name.trim(), roles:roles ? [roles[0]] : []}); cb(id);
    }, onPick:it => cb(it.v)});
}
function lotItem(S, x, extra){
  return {v:x.lot.id + "|" + x.i, t:x.lot.no + " · " + compPN(S, x.lot.comp), s:stepName(x.lot, x.i) + " · " + n0(x.qty) + " " + (extra || "waiting") + " · " + compName(S, x.lot.comp), kw:compName(S, x.lot.comp), x};
}
function personField(bind, val, label, hi, list){
  const id = "dl-" + list;
  return fld(label, hi, inText(bind, val, {list:id, ph:"Name"}) + datalist(id, namesFor(list)));
}
function shiftField(F){ return fld("Shift", "शिफ्ट", segc("shift", F.shift, [{v:"A", t:"A"}, {v:"B", t:"B"}, {v:"C", t:"C"}])); }
function dieHint(dieNo){
  const d = dieNo ? dieByNo(dieNo) : null;
  if (!d) return dieNo ? "Die " + esc(dieNo) + " not found in PM Tracker" : "";
  const s = toolPM(d);
  return '<span class="' + (s.code === "over" ? "hint bad" : s.code === "soon" ? "hint warn" : "") + '" style="margin:0">' + esc(s.text) + (s.code !== "ok" ? " — " + esc(s.label) : "") + '</span>';
}
function mcHint(S, mc){
  if (!mc) return "Optional — fills part & die from the machine's setup";
  const m = machineByNo(mc), su = S.mc[mc];
  let h = su ? "Set up: " + esc(setupText(S, su)) : "No setup recorded on this machine";
  if (m && m.openBreakdownId) h = '<span class="hint bad" style="margin:0">⚠ Marked DOWN in PM Tracker</span> · ' + h;
  return h;
}
function qtyLine(label, hi, bind, val, o){ return fld(label, hi, inNum(bind, val, Object.assign({big:true}, o || {}))); }
function done(msg){ toast(msg, "ok"); closeTop(); render(); }

/* ---------- 1. RM inward ---------- */
function formRM(){
  const S = STATE;
  const specs = []; const seen = new Set();
  for (const c of S.comps.values()){ if (!c.grade) continue; const k = specKey(c); if (seen.has(k)) continue; seen.add(k); specs.push(c); }
  const F = {date:dayKey(), party:"", doc:"", form:"coil", grade:"", thk:"", width:"", len:"", n:1, total:"", heat:"", coils:[{no:"", kg:"", heat:""}], auto:true, remark:""};
  const resize = () => { const n = clamp(toInt(F.n) || 1, 1, 60); F.n = n; while (F.coils.length < n) F.coils.push({no:"", kg:"", heat:""}); F.coils.length = n; if (F.auto) split(); };
  const split = () => { const t = toNum(F.total); if (t > 0){ const each = Math.round(t / F.coils.length * 10) / 10; F.coils.forEach((c, i) => c.kg = i === F.coils.length - 1 ? String(Math.round((t - each * (F.coils.length - 1)) * 10) / 10) : String(each)); } };
  const unit = () => F.form === "sheet" ? "bundles" : "coils";
  formSheet({title:"RM inward", hi:"कच्चा माल आवक", F,
    body:F => fld("Supplier", "सप्लायर", pf("party", partyName(S, F.party), "", {ph:"Choose supplier"})) +
      '<div class="frow">' + fld("Invoice / challan no.", "बिल नंबर", inText("doc", F.doc, {cap:true})) + fld("Date", "तारीख", inText("date", F.date, {type:"date"})) + '</div>' +
      fld("Material form", "", segc("form", F.form, [{v:"coil", t:"Coil", hi:"कॉइल"}, {v:"sheet", t:"Sheet", hi:"शीट"}, {v:"wire", t:"Wire", hi:"वायर"}])) +
      (specs.length ? '<div class="fld"><div class="lbl">Same spec as a part<span class="hi">पार्ट जैसा</span></div>' + qbtns(specs.slice(0, 8).map((c, i) => ({act:"spec", t:specLabel(c), data:' data-i="' + i + '"'}))) + '</div>' : "") +
      fld("Material grade", "ग्रेड", inText("grade", F.grade, {list:"dl-grades", ph:"e.g. CRCA IS513 CR2"}) + datalist("dl-grades", [...new Set(GRADES.concat([...S.coils.values()].map(c => c.grade)).filter(Boolean))]), {req:true}) +
      '<div class="frow">' + fld(F.form === "wire" ? "Wire dia (mm)" : "Thickness (mm)", F.form === "wire" ? "मोटाई" : "मोटाई", inNum("thk", F.thk, {dec:true, ph:"1.2"}), {req:true}) +
      (F.form !== "wire" ? fld("Width (mm)", "चौड़ाई", inNum("width", F.width, {dec:true, ph:"125"}), {req:true}) : "") +
      (F.form === "sheet" ? fld("Length (mm)", "लंबाई", inNum("len", F.len, {dec:true, ph:"2500"})) : "") + '</div>' +
      '<div class="frow">' + fld("No. of " + unit(), "संख्या", '<div class="stepper"><button type="button" data-fa="n" data-d="-1">−</button><input class="in" inputmode="numeric" data-bind="n" value="' + F.n + '"><button type="button" data-fa="n" data-d="1">+</button></div>') +
      fld("Total weight (kg)", "कुल वजन", inNum("total", F.total, {dec:true, ph:"0"})) + '</div>' +
      fld("Heat no. (all " + unit() + ")", "हीट नंबर", inText("heat", F.heat, {cap:true, ph:"from mill test certificate"})) +
      '<div class="fld"><div class="lbl">Each ' + (F.form === "sheet" ? "bundle" : "coil") + '<span class="hi">हर कॉइल का वजन</span></div><div class="coil-rows">' +
      '<div class="cr"><span></span><span class="cr-h">Coil no.</span><span class="cr-h">Weight kg</span><span class="cr-h">Heat no.</span></div>' +
      F.coils.map((c, i) => '<div class="cr"><span class="cr-n">' + (i + 1) + '</span>' + inText("coils." + i + ".no", c.no, {ph:"auto", cap:true}) + inNum("coils." + i + ".kg", c.kg, {dec:true, ph:"kg"}) + inText("coils." + i + ".heat", c.heat, {ph:F.heat || "same", cap:true}) + '</div>').join("") +
      '</div><div class="hint">Leave coil no. empty to auto-number. Weights split equally from the total until you edit one.</div></div>' +
      fld("Remarks", "टिप्पणी", inArea("remark", F.remark)),
    changed:(F, b) => {
      if (b === "n"){ resize(); }
      if (b === "total" && F.auto){ split(); F.coils.forEach((c, i) => { const el = $('[data-bind="coils.' + i + '.kg"]', F.el); if (el) el.value = c.kg; }); }
      if (/^coils\.\d+\.kg$/.test(b)) F.auto = false;
      if (b === "heat") F.coils.forEach((c, i) => { const el = $('[data-bind="coils.' + i + '.heat"]', F.el); if (el) el.placeholder = F.heat || "same"; });
    },
    summary:F => { const t = sum(F.coils, c => toNum(c.kg)); return t ? "<b>" + F.coils.length + " " + unit() + "</b> · <b>" + kg(t) + "</b>" + (F.grade ? " · " + esc(specLabel(F)) : "") : ""; },
    act:{
      party:F => pickParty(["rm"], F.party, v => { F.party = v; F.redraw(); }, "Supplier"),
      n:(F, d) => { F.n = clamp((toInt(F.n) || 1) + (+d.d), 1, 60); resize(); F.redraw(); },
      spec:(F, d) => { const c = specs[+d.i]; Object.assign(F, {form:c.form || "coil", grade:c.grade, thk:String(c.thk || ""), width:String(c.width || ""), len:String(c.len || "")}); F.redraw(); },
    },
    save:F => {
      if (!F.grade.trim()) return fail("Enter the material grade");
      if (!(toNum(F.thk) > 0)) return fail(F.form === "wire" ? "Enter wire diameter" : "Enter thickness");
      if (F.form !== "wire" && !(toNum(F.width) > 0)) return fail("Enter width");
      if (F.coils.some(c => !(toNum(c.kg) > 0))) return fail("Enter the weight of every " + (F.form === "sheet" ? "bundle" : "coil"));
      const base = autoCoilNo();
      const coils = F.coils.map((c, i) => ({id:uid("c"), no:(c.no || "").trim() || (base + (F.coils.length > 1 ? "-" + (i + 1) : "")), kg:Math.round(toNum(c.kg) * 10) / 10, heat:(c.heat || "").trim() || F.heat.trim()}));
      addEvent("rm.in", {date:F.date || dayKey(), party:F.party, doc:F.doc.trim(), form:F.form, grade:F.grade.trim(), thk:toNum(F.thk), width:F.form === "wire" ? 0 : toNum(F.width), len:F.form === "sheet" ? toNum(F.len) : 0, coils, remark:F.remark.trim()});
      done("RM saved · " + coils.length + " " + unit() + " · " + kg(sum(coils, c => c.kg)));
    }});
}

/* ---------- 2. Die setup ---------- */
function formSetup(pre){

  const steps = () => { const c = S.comps.get(F.comp); return c ? c.route.map((r, i) => ({r, i})).filter(x => x.r.kind === "blank" || x.r.kind === "press") : []; };
  formSheet({title:"Die setup", hi:"मशीन पर डाई लगाना", F,
    body:F => {
      const c = S.comps.get(F.comp), st = steps();
      return fld("Machine", "मशीन", pf("mc", F.mc ? F.mc + " · " + ((machineByNo(F.mc) || {}).toolName || "") : "", mcHint(S, F.mc), {ph:"Choose machine"}), {req:true}) +
        fld("Part", "पार्ट", pf("comp", c ? c.partNo + " · " + c.name : "", c ? esc(specLabel(c)) : "", {ph:"Choose part"}), {req:true}) +
        (c ? fld("Operation", "ऑपरेशन", st.length ? '<div class="qbtns">' + st.map(x => '<button type="button" class="qbtn" style="' + (String(F.step) === String(x.i) ? "border-color:var(--amber);color:var(--amber);background:var(--amber-dim)" : "") + '" data-fa="step" data-i="' + x.i + '">' + (x.i + 1) + ". " + esc(x.r.op) + '</button>').join("") + '</div>' : '<div class="hint warn">This part has no in-house press steps.</div>', {req:true}) : "") +
        fld("Die", "डाई", pf("die", F.die ? F.die + " · " + ((dieByNo(F.die) || {}).toolName || "") : "", dieHint(F.die), {ph:"Choose die"})) +
        personField("person", F.person, "Setter", "सेटर", "setter") + fld("Remarks", "टिप्पणी", inArea("remark", F.remark));
    },
    act:{
      mc:F => pickMachine(F.mc, v => { F.mc = v; F.redraw(); }),
      comp:F => pickComp(F.comp, c => (c.route || []).some(r => r.kind === "blank" || r.kind === "press"), v => { F.comp = v; F.step = ""; F.die = ""; const st = steps(); if (st.length === 1){ F.step = String(st[0].i); F.die = st[0].r.die || ""; } F.redraw(); }),
      step:(F, d) => { F.step = d.i; const c = S.comps.get(F.comp); F.die = (c && c.route[+d.i] && c.route[+d.i].die) || F.die; F.redraw(); },
      die:F => pickDie((S.comps.get(F.comp) || {}).partNo, F.die, v => { F.die = v; F.redraw(); }),
    },
    save:async F => {
      if (!F.mc) return fail("Choose the machine");
      const c = S.comps.get(F.comp); if (!c) return fail("Choose the part");
      if (F.step === "") return fail("Choose the operation");
      const m = machineByNo(F.mc);
      if (m && m.openBreakdownId && !(await confirmBox("Machine is down", F.mc + " has an open breakdown in PM Tracker. Record the setup anyway?", "Record anyway"))) return false;
      lsSet("pt-last-mc", F.mc); lsSet("pt-last-setter", F.person.trim()); rememberName("setter", F.person);
      addEvent("setup", {mc:F.mc, die:F.die, comp:F.comp, step:+F.step, opName:c.route[+F.step].op, person:F.person.trim(), remark:F.remark.trim()});
      done("Setup saved · " + F.mc + " → " + c.partNo + " " + c.route[+F.step].op);
    }});
}

/* ---------- 3. Blanking ---------- */
function formBlank(pre){
  pre = pre || {};
  const S = STATE;
  const F = {mc:pre.mc || "", comp:pre.comp || "", coil:"", lotMode:"new", lotNo:autoLotNo(), lot:"", ok:"", rej:"", kg:"", kgAuto:true, coilDone:false, die:"", person:lsGet("pt-last-op", ""), shift:shiftNow(), remark:""};
  const fromMc = () => { const su = S.mc[F.mc]; if (su && +su.step === 0){ const c = S.comps.get(su.comp); if (c && c.route[0] && c.route[0].kind === "blank"){ F.comp = su.comp; F.die = su.die || c.route[0].die || ""; } } };
  if (F.mc) fromMc();
  if (F.comp && !F.die){ const c = S.comps.get(F.comp); if (c) F.die = c.route[0].die || ""; }
  const comp = () => S.comps.get(F.comp);
  const coil = () => S.coils.get(F.coil);
  const autoKg = () => { const c = comp(); return c && +c.wt > 0 ? Math.round((toNum(F.ok) + toNum(F.rej)) * c.wt * 10) / 10 : 0; };
  const kgHint = () => {
    const co = coil(), c = comp(), k = toNum(F.kg);
    let h = c && +c.wt > 0 ? "Auto = pieces × " + n3(c.wt) + " kg" : "Set kg per piece on the part to auto-calculate";
    if (co){ const after = co.rem - k; h += ' · coil balance <b>' + kg(co.rem) + '</b>' + (F.coilDone ? " → finished" : ' → <b class="' + (after < -0.5 ? "" : "") + '">' + kg(Math.max(0, after)) + '</b> after'); if (!F.coilDone && after < -0.5) h = '<span class="hint bad" style="margin:0">More than the coil balance (' + kg(co.rem) + '). Tick “coil finished” if it is over.</span>'; }
    return h;
  };
  const sync = () => { const el = $('#h-kg', F.el); if (el) el.innerHTML = kgHint(); };
  formSheet({title:"Blanking", hi:"ब्लैंकिंग / कटिंग — कॉइल से लॉट बनाना", F,
    body:F => {
      const c = comp(), co = coil();
      const lot = F.lot ? S.lots.get(F.lot) : null;
      return fld("Machine", "मशीन", pf("mc", F.mc, mcHint(S, F.mc), {ph:"Choose machine (optional)"})) +
        fld("Part", "पार्ट", pf("comp", c ? c.partNo + " · " + c.name : "", c ? esc(specLabel(c)) + " · " + n3(c.wt || 0) + " kg/pc" : "", {ph:"Choose part"}), {req:true}) +
        fld("Coil / RM used", "कौन सी कॉइल", pf("coil", co ? co.no + (co.heat ? " · heat " + co.heat : "") : "", co ? esc(specLabel(co)) + " · balance " + kg(co.rem) + (c && !coilMatches(co, c) ? ' · <span style="color:#f2c35a">not the part’s spec</span>' : "") : (c ? "Needs " + esc(specLabel(c)) : ""), {ph:"Choose coil"})) +
        fld("Lot", "लॉट", segc("lotMode", F.lotMode, [{v:"new", t:"New lot", hi:"नया लॉट"}, {v:"add", t:"Add to a lot", hi:"पुराने लॉट में"}]) +
          (F.lotMode === "new" ? inText("lotNo", F.lotNo, {cap:true}) + '<div class="hint">Write this number on the job card / bin tag. Change it if you use printed job cards.</div>' :
            pf("lot", lot ? lot.no : "", lot ? esc(compPN(S, lot.comp)) + " · started " + fmtD(lot.ts) + " · " + n0(lot.steps[0] ? lot.steps[0].ok : 0) + " blanked so far" : "", {ph:"Choose lot (e.g. second coil for the same lot)"}))) +
        '<div class="qty-grid" style="grid-template-columns:1fr 1fr">' + qtyLine("OK blanks", "ठीक", "ok", F.ok) + qtyLine("Rejected", "रिजेक्ट", "rej", F.rej) + '</div>' +
        '<div class="fld" style="margin-top:14px"><label>Kg used<span class="hi">कितने किलो लगे</span></label>' + inNum("kg", F.kg, {dec:true, ph:"0", ro:F.coilDone}) + '<div class="hint" id="h-kg">' + kgHint() + '</div>' +
        (co ? '<label class="chk"><input type="checkbox" data-bind="coilDone" ' + (F.coilDone ? "checked" : "") + '> Coil finished — use all remaining ' + kg(co.rem) + '</label>' : "") + '</div>' +
        fld("Die", "डाई", pf("die", F.die, dieHint(F.die), {ph:"Choose die"})) +
        '<div class="frow">' + personField("person", F.person, "Operator", "ऑपरेटर", "op") + shiftField(F) + '</div>' + fld("Remarks", "टिप्पणी", inArea("remark", F.remark));
    },
    changed:(F, b, el, struct) => {
      if ((b === "ok" || b === "rej") && F.kgAuto && !F.coilDone){ const k = autoKg(); F.kg = k ? String(k) : ""; const i = $('[data-bind="kg"]', F.el); if (i) i.value = F.kg; }
      if (b === "kg") F.kgAuto = false;
      if (b === "coilDone"){ const co = coil(); if (F.coilDone && co){ F.kg = String(Math.round(co.rem * 10) / 10); } else { F.kgAuto = true; F.kg = autoKg() ? String(autoKg()) : ""; } F.redraw(); return; }
      sync();
    },
    summary:F => { const c = comp(); return c && toNum(F.ok) ? "<b>" + n0(F.ok) + "</b> blanks of <b>" + esc(c.partNo) + "</b>" + (F.lotMode === "new" ? " → new lot <b>" + esc(F.lotNo) + "</b>" : "") : ""; },
    act:{
      mc:F => pickMachine(F.mc, v => { F.mc = v; fromMc(); F.redraw(); }),
      comp:F => pickComp(F.comp, c => c.route && c.route[0] && c.route[0].kind === "blank", v => { F.comp = v; F.die = (S.comps.get(v).route[0] || {}).die || ""; F.lot = ""; if (F.coil && !coilMatches(coil(), comp())) F.coil = ""; F.redraw(); }, "No parts start with blanking — check routes in More → Parts"),
      coil:F => {
        const c = comp(), list = [...S.coils.values()].filter(x => !x.done && x.rem > 0.05).sort((a, b) => a.ts < b.ts ? -1 : 1);
        const mk = (x, g) => ({v:x.id, t:x.no + (x.heat ? " · heat " + x.heat : ""), s:specLabel(x) + " · " + kg(x.rem) + " left · " + partyName(S, x.party) + " · " + fmtD(x.ts), g, kw:x.heat});
        const m = c ? list.filter(x => coilMatches(x, c)) : [], o = c ? list.filter(x => !coilMatches(x, c)) : list;
        pick({title:"Coil", hi:"कॉइल चुनें — पुरानी पहले", items:m.map(x => mk(x, "Matching " + specLabel(c))).concat(o.map(x => mk(x, c ? "Other material" : "In stock"))), value:F.coil,
          empty:"No coils in stock — record RM inward first", onPick:it => { F.coil = it.v; if (F.coilDone){ F.kg = String(Math.round(coil().rem * 10) / 10); } F.redraw(); }});
      },
      lot:F => {
        const list = [...S.lots.values()].filter(l => l.comp === F.comp && l.route[0].kind === "blank" && Date.now() - new Date(l.ts) < 15 * 864e5).sort((a, b) => b.ts < a.ts ? -1 : 1);
        pick({title:"Add to lot", hi:"लॉट चुनें", items:list.map(l => ({v:l.id, t:l.no, s:fmtD(l.ts) + " · " + n0(l.steps[0] ? l.steps[0].ok : 0) + " blanked"})), value:F.lot, empty:F.comp ? "No recent lots for this part" : "Choose the part first", onPick:it => { F.lot = it.v; F.redraw(); }});
      },
      die:F => pickDie((comp() || {}).partNo, F.die, v => { F.die = v; F.redraw(); }),
    },
    save:async F => {
      const c = comp(); if (!c) return fail("Choose the part");
      const ok = toInt(F.ok), rej = toInt(F.rej), k = Math.round(toNum(F.kg) * 10) / 10;
      if (ok <= 0) return fail("Enter OK quantity");
      if (rej < 0) return fail("Rejected cannot be negative");
      let lotId, lotNo, newLot = F.lotMode === "new";
      if (newLot){
        lotNo = F.lotNo.trim(); if (!lotNo) return fail("Enter the lot number");
        if ([...S.lots.values()].some(l => norm(l.no) === norm(lotNo))) return fail("Lot " + lotNo + " already exists — use “Add to a lot” or a new number");
        lotId = uid("l");
      } else { const l = S.lots.get(F.lot); if (!l) return fail("Choose the lot to add to"); lotId = l.id; lotNo = l.no; }
      const co = coil();
      if (!co && !(await confirmBox("No coil selected", "Without a coil the lot cannot be traced back to its heat number. Save anyway?", "Save without coil"))) return false;
      if (co && !F.coilDone && k > co.rem + 0.5) return fail("More than the coil balance (" + kg(co.rem) + ")");
      if (co && !coilMatches(co, c) && !(await confirmBox("Different material", "Coil " + co.no + " is " + specLabel(co) + " but " + c.partNo + " needs " + specLabel(c) + ". Save anyway?", "Save anyway"))) return false;
      lsSet("pt-last-op", F.person.trim()); rememberName("op", F.person);
      addEvent("blank", {lot:lotId, lotNo, newLot, route:newLot ? c.route : undefined, comp:c.id, coil:co ? co.id : "", kg:k, coilDone:!!(co && F.coilDone), ok, rej, mc:F.mc, die:F.die, person:F.person.trim(), shift:F.shift, remark:F.remark.trim()});
      done("Lot " + lotNo + " · " + n0(ok) + " blanks saved");
    }});
}

/* ---------- 4. Press operation (bending, piercing, embossing…) ---------- */
function formOp(pre){
  pre = pre || {};
  const S = STATE;
  const F = {mc:pre.mc || "", key:pre.lot != null ? pre.lot + "|" + pre.step : "", ok:"", rej:"", rwk:"", die:"", person:lsGet("pt-last-op", ""), shift:shiftNow(), remark:""};
  const cur = () => { if (!F.key) return null; const [lid, i] = F.key.split("|"); const lot = S.lots.get(lid); if (!lot || !lot.calc[+i]) return null; return {lot, i:+i, c:lot.calc[+i], qty:lot.calc[+i].wait}; };
  const setKey = k => { F.key = k; const x = cur(); if (x){ const su = S.mc[F.mc]; F.die = (su && su.comp === x.lot.comp && +su.step === x.i && su.die) || x.lot.route[x.i].die || ""; } };
  if (F.key) setKey(F.key);
  const qHint = () => { const x = cur(); if (!x) return ""; const t = toInt(F.ok) + toInt(F.rej) + toInt(F.rwk); return t > x.qty ? '<span class="hint bad" style="margin:0">Total ' + n0(t) + ' is more than the ' + n0(x.qty) + ' waiting</span>' : "Waiting at this step: <b>" + n0(x.qty) + "</b>" + (t ? " · left after: <b>" + n0(x.qty - t) + "</b>" : ""); };
  formSheet({title:"Press operation", hi:"बेंडिंग, पंचिंग, एम्बॉसिंग आदि", F,
    body:F => {
      const x = cur();
      return fld("Machine", "मशीन", pf("mc", F.mc, mcHint(S, F.mc), {ph:"Choose machine"})) +
        fld("Lot & operation", "लॉट व ऑपरेशन", pf("lot", x ? x.lot.no + " · " + compPN(S, x.lot.comp) : "", x ? esc(compName(S, x.lot.comp)) : "", {ph:"Choose lot"}), {req:true}) +
        (x ? '<div class="box" style="margin-top:-4px">' + routeStrip(x.lot.route, x.i, x.i) + '</div>' : "") +
        '<div class="qty-grid">' + qtyLine("OK", "ठीक", "ok", F.ok) + qtyLine("Rejected", "रिजेक्ट", "rej", F.rej) + qtyLine("Rework hold", "रीवर्क", "rwk", F.rwk) + '</div>' +
        '<div class="hint" id="h-q" style="margin:6px 0 4px">' + qHint() + '</div>' + (x ? qbtns([{act:"all", t:"All " + n0(x.qty) + " OK"}]) : "") +
        '<div style="height:12px"></div>' + fld("Die", "डाई", pf("die", F.die, dieHint(F.die), {ph:"Choose die"})) +
        '<div class="frow">' + personField("person", F.person, "Operator", "ऑपरेटर", "op") + shiftField(F) + '</div>' + fld("Remarks", "टिप्पणी", inArea("remark", F.remark));
    },
    changed:F => { const el = $("#h-q", F.el); if (el) el.innerHTML = qHint(); },
    summary:F => { const x = cur(); return x && toInt(F.ok) ? "<b>" + esc(stepName(x.lot, x.i)) + "</b> · " + n0(F.ok) + " OK on lot <b>" + esc(x.lot.no) + "</b>" : ""; },
    act:{
      mc:F => pickMachine(F.mc, v => { F.mc = v; const su = S.mc[v]; if (su && !F.key){ const m = lotsWaiting(S, ["press"]).filter(w => w.lot.comp === su.comp && w.i === +su.step); if (m.length === 1) setKey(m[0].lot.id + "|" + m[0].i); } F.redraw(); }),
      lot:F => {
        const su = S.mc[F.mc], all = lotsWaiting(S, ["press"]);
        const mine = su ? all.filter(w => w.lot.comp === su.comp && w.i === +su.step) : [];
        const items = mine.map(w => Object.assign(lotItem(S, w), {g:"Set up on " + F.mc})).concat(all.filter(w => !mine.includes(w)).map(w => Object.assign(lotItem(S, w), {g:mine.length ? "Other lots" : "Waiting for an operation"})));
        pick({title:"Choose lot", hi:"किस लॉट पर काम हुआ", items, value:F.key, empty:"No lots waiting for a press operation", emptyHi:"पहले ब्लैंकिंग दर्ज करें", onPick:it => { setKey(it.v); F.redraw(); }});
      },
      all:F => { const x = cur(); if (!x) return; F.ok = String(Math.max(0, x.qty - toInt(F.rej) - toInt(F.rwk))); F.redraw(); },
      die:F => { const x = cur(); pickDie(x ? compPN(S, x.lot.comp) : "", F.die, v => { F.die = v; F.redraw(); }); },
    },
    save:F => {
      const x = cur(); if (!x) return fail("Choose the lot");
      const ok = toInt(F.ok), rej = toInt(F.rej), rwk = toInt(F.rwk);
      if (ok < 0 || rej < 0 || rwk < 0) return fail("Quantities cannot be negative");
      if (ok + rej + rwk <= 0) return fail("Enter the quantity done");
      if (ok + rej + rwk > x.qty) return fail("Only " + n0(x.qty) + " waiting at " + stepName(x.lot, x.i) + ". Check the previous step's entry.");
      lsSet("pt-last-op", F.person.trim()); rememberName("op", F.person);
      addEvent("op", {lot:x.lot.id, step:x.i, ok, rej, rwk, mc:F.mc, die:F.die, person:F.person.trim(), shift:F.shift, remark:F.remark.trim()});
      done(stepName(x.lot, x.i) + " saved · lot " + x.lot.no);
    }});
}

/* ---------- 5. Send out: job work / plating / heat treatment ---------- */
function formSend(pre){
  pre = pre || {};
  const S = STATE;
  const F = {party:pre.party || "", sel:{}, doc:"", veh:"", remark:"", issue:null};
  if (pre.lot != null){ const l = S.lots.get(pre.lot); if (l){ F.sel[pre.lot + "|" + pre.step] = String(l.calc[pre.step].wait); F.party = F.party || l.route[pre.step].party || ""; } }
  const cands = () => {
    const all = lotsWaiting(S, ["out"]);
    const mine = F.party ? all.filter(w => w.lot.route[w.i].party === F.party) : [];
    return {mine, rest:all.filter(w => !mine.includes(w))};
  };
  const lines = () => Object.entries(F.sel).filter(([k, v]) => v !== false && v != null).map(([k, v]) => { const [lid, i] = k.split("|"); const lot = S.lots.get(lid); return lot ? {k, lot, i:+i, qty:toInt(v), max:lot.calc[+i].wait} : null; }).filter(Boolean);
  const lineHtml = (w, F) => {
    const k = w.lot.id + "|" + w.i, on = F.sel[k] != null && F.sel[k] !== false;
    return '<div class="line-it ' + (on ? "on" : "") + '"><label class="li-top"><input type="checkbox" data-fa="tog" data-k="' + esc(k) + '" ' + (on ? "checked" : "") + '><div class="li-main"><div class="p-t" style="font-weight:700">' + esc(w.lot.no) + ' · ' + esc(compPN(S, w.lot.comp)) + '</div><div class="p-s muted" style="font-size:12px">→ ' + esc(stepName(w.lot, w.i)) + ' · ' + n0(w.qty) + ' ready</div></div></label>' +
      (on ? '<div class="li-qty one">' + fld("Qty to send", "कितना भेजा", inNum("sel." + k, F.sel[k], {big:true})) + '</div>' : "") + '</div>';
  };
  const outFirst = c => c.route && c.route[0] && c.route[0].kind === "out";
  formSheet({title:"Send out", hi:"जॉब वर्क / प्लेटिंग / हार्डनिंग के लिए भेजें", F,
    body:F => {
      const {mine, rest} = cands();
      let h = fld("Supplier", "सप्लायर", pf("party", partyName(S, F.party), "", {ph:"Choose supplier"}), {req:true});
      h += '<div class="fld"><div class="lbl">Lots to send<span class="hi">कौन से लॉट</span></div>';
      if (!mine.length && !rest.length) h += '<div class="empty" style="padding:16px">No lots are waiting to go out.<span class="hi">कोई लॉट भेजने के लिए तैयार नहीं</span></div>';
      if (mine.length) h += '<div class="pick-g" style="padding-left:2px">Usually sent to ' + esc(partyName(S, F.party)) + '</div>' + mine.map(w => lineHtml(w, F)).join("");
      if (rest.length) h += '<div class="pick-g" style="padding-left:2px">' + (mine.length ? "Other lots ready to send" : "Ready to send") + '</div>' + rest.map(w => lineHtml(w, F)).join("");
      h += '</div>';
      if (F.issue){
        const c = S.comps.get(F.issue.comp), co = S.coils.get(F.issue.coil);
        h += '<div class="box"><div class="box-h">Issue RM for a fully outsourced part</div>' +
          fld("Part", "पार्ट", pf("icomp", c ? c.partNo + " · " + c.name : "", c ? esc(specLabel(c)) : "", {ph:"Choose part"})) +
          '<div class="frow">' + fld("Lot no.", "लॉट", inText("issue.lotNo", F.issue.lotNo, {cap:true})) + fld("Pcs to make", "कितने पीस", inNum("issue.qty", F.issue.qty, {})) + '</div>' +
          fld("Coil issued", "कॉइल", pf("icoil", co ? co.no + " · " + kg(co.rem) + " left" : "", co ? esc(specLabel(co)) : "Optional — if you supply the material", {ph:"No coil (supplier's material)"})) +
          (co ? fld("Kg issued", "कितने किलो", inNum("issue.kg", F.issue.kg, {dec:true})) : "") +
          '<button type="button" class="link" data-fa="noissue">Remove</button></div>';
      } else if ([...S.comps.values()].some(outFirst)) h += '<button type="button" class="btn btn-sm" data-fa="issue" style="margin-bottom:14px">' + ic("plus") + 'Issue RM for a fully outsourced part</button>';
      h += '<div class="frow">' + fld("Challan no.", "चालान नंबर", inText("doc", F.doc, {cap:true})) + fld("Vehicle no.", "गाड़ी नंबर", inText("veh", F.veh, {cap:true, ph:"HR-51-…"})) + '</div>' + fld("Remarks", "टिप्पणी", inArea("remark", F.remark));
      return h;
    },
    summary:F => { const L = lines(); const q = sum(L, l => l.qty) + (F.issue ? toInt(F.issue.qty) : 0); return q ? "<b>" + (L.length + (F.issue ? 1 : 0)) + " " + plural(L.length + (F.issue ? 1 : 0), "lot") + "</b> · <b>" + n0(q) + "</b> pcs" + (F.party ? " → " + esc(partyName(S, F.party)) : "") : ""; },
    act:{
      party:F => pickParty(["job", "plating", "heat", "coating"], F.party, v => { F.party = v; F.redraw(); }, "Supplier"),
      tog:(F, d, el) => { const k = d.k; if (el.checked){ const [lid, i] = k.split("|"); const l = S.lots.get(lid); F.sel[k] = String(l ? l.calc[+i].wait : ""); if (!F.party && l) F.party = l.route[+i].party || ""; } else delete F.sel[k]; F.redraw(); },
      issue:F => { F.issue = {comp:"", lotNo:autoLotNo(), qty:"", coil:"", kg:""}; F.redraw(); },
      noissue:F => { F.issue = null; F.redraw(); },
      icomp:F => pickComp(F.issue.comp, outFirst, v => { F.issue.comp = v; const c = S.comps.get(v); if (!F.party && c) F.party = c.route[0].party || ""; F.redraw(); }, "No part has an outside process as its first step"),
      icoil:F => { const c = S.comps.get(F.issue.comp); const list = [...S.coils.values()].filter(x => !x.done && x.rem > 0.05);
        pick({title:"Coil issued", items:[{v:"", t:"No coil (supplier's own material)", s:""}].concat(list.map(x => ({v:x.id, t:x.no + (x.heat ? " · heat " + x.heat : ""), s:specLabel(x) + " · " + kg(x.rem) + " left", g:c && coilMatches(x, c) ? "Matching" : "Other"}))), value:F.issue.coil,
          onPick:it => { F.issue.coil = it.v; if (it.v && c && +c.wt > 0 && toInt(F.issue.qty)) F.issue.kg = String(Math.round(toInt(F.issue.qty) * c.wt * 10) / 10); F.redraw(); }}); },
    },
    save:F => {
      if (!F.party) return fail("Choose the supplier");
      const L = lines().filter(l => l.qty > 0), out = [];
      for (const l of L){ if (l.qty > l.max) return fail("Lot " + l.lot.no + ": only " + n0(l.max) + " ready to send"); out.push({lot:l.lot.id, step:l.i, qty:l.qty}); }
      if (F.issue){
        const c = S.comps.get(F.issue.comp); if (!c) return fail("Choose the outsourced part");
        const q = toInt(F.issue.qty); if (q <= 0) return fail("Enter pcs to make");
        const lotNo = (F.issue.lotNo || "").trim(); if (!lotNo) return fail("Enter lot no.");
        if ([...S.lots.values()].some(l => norm(l.no) === norm(lotNo))) return fail("Lot " + lotNo + " already exists");
        const co = S.coils.get(F.issue.coil), k = toNum(F.issue.kg);
        if (co && k > co.rem + 0.5) return fail("Coil " + co.no + " has only " + kg(co.rem));
        out.push({lot:uid("l"), lotNo, newLot:true, comp:c.id, route:c.route, step:0, qty:q, coil:co ? co.id : "", kg:co ? k : 0});
      }
      if (!out.length) return fail("Tick at least one lot and enter the qty");
      addEvent("out.send", {party:F.party, doc:F.doc.trim(), veh:F.veh.trim(), remark:F.remark.trim(), lines:out});
      done("Sent " + n0(sum(out, l => l.qty)) + " pcs to " + partyName(S, F.party));
    }});
}

/* ---------- 6. Receive back from supplier ---------- */
function formRecv(pre){
  pre = pre || {};
  const S = STATE;
  const F = {party:pre.party || "", sel:{}, doc:"", remark:"", bought:null};
  if (pre.lot != null){ const l = S.lots.get(pre.lot); if (l){ const c = l.calc[pre.step]; F.party = F.party || c.party; F.sel[pre.lot + "|" + pre.step] = {ok:String(c.sup), rej:""}; } }
  const cands = () => lotsAtSupplier(S, F.party || null);
  const lines = () => Object.entries(F.sel).map(([k, v]) => { const [lid, i] = k.split("|"); const lot = S.lots.get(lid); return lot ? {k, lot, i:+i, ok:toInt(v.ok), rej:toInt(v.rej), max:lot.calc[+i].sup} : null; }).filter(Boolean);
  const outFirst = c => c.route && c.route[0] && c.route[0].kind === "out";
  formSheet({title:"Receive back", hi:"सप्लायर से माल वापस", F,
    body:F => {
      const list = cands();
      let h = fld("Supplier", "सप्लायर", pf("party", partyName(S, F.party), F.party ? n0(sum(list, x => x.qty)) + " pcs pending with them" : "", {ph:"Choose supplier"}), {req:true});
      h += '<div class="fld"><div class="lbl">Lots received<span class="hi">कौन से लॉट आए</span></div>';
      if (!list.length) h += '<div class="empty" style="padding:16px">' + (F.party ? "Nothing pending with this supplier." : "Choose the supplier.") + '</div>';
      h += list.map(w => {
        const k = w.lot.id + "|" + w.i, v = F.sel[k];
        return '<div class="line-it ' + (v ? "on" : "") + '"><label class="li-top"><input type="checkbox" data-fa="tog" data-k="' + esc(k) + '" ' + (v ? "checked" : "") + '><div class="li-main"><div class="p-t" style="font-weight:700">' + esc(w.lot.no) + ' · ' + esc(compPN(S, w.lot.comp)) + '</div><div class="p-s muted" style="font-size:12px">' + esc(stepName(w.lot, w.i)) + ' · ' + n0(w.qty) + ' pending' + (w.c.since ? " · sent " + fmtD(w.c.since) + " (" + daysSince(w.c.since) + " d)" : "") + '</div></div></label>' +
          (v ? '<div class="li-qty">' + fld("OK received", "ठीक आया", inNum("sel." + k + ".ok", v.ok, {big:true})) + fld("Rejected / short", "रिजेक्ट / कम", inNum("sel." + k + ".rej", v.rej, {big:true})) + '</div>' : "") + '</div>';
      }).join("") + '</div>';
      if (F.bought){
        const c = S.comps.get(F.bought.comp);
        h += '<div class="box"><div class="box-h">Bought-out part (no RM sent)</div>' + fld("Part", "पार्ट", pf("bcomp", c ? c.partNo + " · " + c.name : "", "", {ph:"Choose part"})) +
          '<div class="frow">' + fld("Lot no.", "लॉट", inText("bought.lotNo", F.bought.lotNo, {cap:true})) + '</div><div class="frow">' + fld("OK received", "ठीक", inNum("bought.ok", F.bought.ok, {big:true})) + fld("Rejected", "रिजेक्ट", inNum("bought.rej", F.bought.rej, {big:true})) + '</div><button type="button" class="link" data-fa="nobought">Remove</button></div>';
      } else if ([...S.comps.values()].some(outFirst)) h += '<button type="button" class="btn btn-sm" data-fa="bought" style="margin-bottom:14px">' + ic("plus") + 'Bought-out part arriving (no RM sent)</button>';
      h += fld("Their challan no.", "उनका चालान नंबर", inText("doc", F.doc, {cap:true})) + fld("Remarks", "टिप्पणी", inArea("remark", F.remark));
      return h;
    },
    summary:F => { const L = lines(); const q = sum(L, l => l.ok) + (F.bought ? toInt(F.bought.ok) : 0); return q ? "<b>" + n0(q) + "</b> pcs OK" + (F.party ? " from " + esc(partyName(S, F.party)) : "") : ""; },
    act:{
      party:F => pickParty(["job", "plating", "heat", "coating"], F.party, v => { F.party = v; F.sel = {}; F.redraw(); }, "Supplier"),
      tog:(F, d, el) => { const k = d.k; if (el.checked){ const [lid, i] = k.split("|"); const l = S.lots.get(lid); F.sel[k] = {ok:String(l ? l.calc[+i].sup : ""), rej:""}; } else delete F.sel[k]; F.redraw(); },
      bought:F => { F.bought = {comp:"", lotNo:autoLotNo(), ok:"", rej:""}; F.redraw(); },
      nobought:F => { F.bought = null; F.redraw(); },
      bcomp:F => pickComp(F.bought.comp, outFirst, v => { F.bought.comp = v; F.redraw(); }, "No part has an outside process as its first step"),
    },
    save:F => {
      if (!F.party) return fail("Choose the supplier");
      const out = [];
      for (const l of lines()){
        if (l.ok < 0 || l.rej < 0) return fail("Quantities cannot be negative");
        if (l.ok + l.rej <= 0) continue;
        if (l.ok + l.rej > l.max) return fail("Lot " + l.lot.no + ": only " + n0(l.max) + " pending with the supplier");
        out.push({lot:l.lot.id, step:l.i, ok:l.ok, rej:l.rej});
      }
      if (F.bought){
        const c = S.comps.get(F.bought.comp); if (!c) return fail("Choose the bought-out part");
        const ok = toInt(F.bought.ok), rej = toInt(F.bought.rej); if (ok + rej <= 0) return fail("Enter qty received");
        const lotNo = (F.bought.lotNo || "").trim(); if (!lotNo) return fail("Enter lot no.");
        if ([...S.lots.values()].some(l => norm(l.no) === norm(lotNo))) return fail("Lot " + lotNo + " already exists");
        out.push({lot:uid("l"), lotNo, newLot:true, comp:c.id, route:c.route, step:0, ok, rej});
      }
      if (!out.length) return fail("Tick a lot and enter the qty received");
      addEvent("out.recv", {party:F.party, doc:F.doc.trim(), remark:F.remark.trim(), lines:out});
      done("Received " + n0(sum(out, l => l.ok)) + " pcs OK from " + partyName(S, F.party));
    }});
}

/* ---------- 7. Inspection & packing ---------- */
function formInsp(pre){
  pre = pre || {};
  const S = STATE;
  const F = {key:pre.lot != null ? pre.lot + "|" + pre.step : "", ok:"", rej:"", rwk:"", boxes:"", boxAuto:true, person:lsGet("pt-last-insp", ""), remark:""};
  const cur = () => { if (!F.key) return null; const [lid, i] = F.key.split("|"); const lot = S.lots.get(lid); if (!lot || !lot.calc[+i]) return null; return {lot, i:+i, qty:lot.calc[+i].wait}; };
  const qHint = () => { const x = cur(); if (!x) return ""; const t = toInt(F.ok) + toInt(F.rej) + toInt(F.rwk); return t > x.qty ? '<span class="hint bad" style="margin:0">Total ' + n0(t) + ' is more than the ' + n0(x.qty) + ' waiting</span>' : "Waiting for inspection: <b>" + n0(x.qty) + "</b>"; };
  formSheet({title:"Inspection & packing", hi:"निरीक्षण व पैकिंग", F,
    body:F => {
      const x = cur(), c = x ? S.comps.get(x.lot.comp) : null;
      return fld("Lot", "लॉट", pf("lot", x ? x.lot.no + " · " + compPN(S, x.lot.comp) : "", x ? esc(compName(S, x.lot.comp)) + " · " + esc(partyName(S, (c || {}).cust)) : "", {ph:"Choose lot"}), {req:true}) +
        personField("person", F.person, "Inspected by", "इंस्पेक्टर", "insp") +
        '<div class="qty-grid">' + qtyLine("OK", "पास", "ok", F.ok) + qtyLine("Rejected", "रिजेक्ट", "rej", F.rej) + qtyLine("Rework", "रीवर्क", "rwk", F.rwk) + '</div>' +
        '<div class="hint" id="h-q" style="margin:6px 0 4px">' + qHint() + '</div>' + (x ? qbtns([{act:"all", t:"All " + n0(x.qty) + " OK"}]) : "") + '<div style="height:12px"></div>' +
        fld("Boxes / packs", "बॉक्स", inNum("boxes", F.boxes, {}), {hint:c && +c.pack ? "Standard pack " + n0(c.pack) + " pcs" : ""}) + fld("Remarks", "टिप्पणी", inArea("remark", F.remark));
    },
    changed:(F, b) => {
      const x = cur(), c = x ? S.comps.get(x.lot.comp) : null;
      if (b === "boxes") F.boxAuto = false;
      if (b === "ok" && F.boxAuto && c && +c.pack){ F.boxes = toInt(F.ok) ? String(Math.ceil(toInt(F.ok) / c.pack)) : ""; const el = $('[data-bind="boxes"]', F.el); if (el) el.value = F.boxes; }
      const el = $("#h-q", F.el); if (el) el.innerHTML = qHint();
    },
    summary:F => { const x = cur(); return x && toInt(F.ok) ? "<b>" + n0(F.ok) + "</b> OK → finished goods" : ""; },
    act:{
      lot:F => { const items = lotsWaiting(S, ["insp"]).map(w => lotItem(S, w)); pick({title:"Choose lot", hi:"निरीक्षण के लिए लॉट", items, value:F.key, empty:"No lots waiting for inspection", onPick:it => { F.key = it.v; F.redraw(); }}); },
      all:F => { const x = cur(); if (!x) return; F.ok = String(Math.max(0, x.qty - toInt(F.rej) - toInt(F.rwk))); const c = S.comps.get(x.lot.comp); if (F.boxAuto && c && +c.pack) F.boxes = String(Math.ceil(toInt(F.ok) / c.pack)); F.redraw(); },
    },
    save:F => {
      const x = cur(); if (!x) return fail("Choose the lot");
      const ok = toInt(F.ok), rej = toInt(F.rej), rwk = toInt(F.rwk);
      if (ok < 0 || rej < 0 || rwk < 0) return fail("Quantities cannot be negative");
      if (ok + rej + rwk <= 0) return fail("Enter the quantity inspected");
      if (ok + rej + rwk > x.qty) return fail("Only " + n0(x.qty) + " waiting for inspection");
      if (!F.person.trim()) return fail("Enter the inspector's name");
      lsSet("pt-last-insp", F.person.trim()); rememberName("insp", F.person);
      addEvent("insp", {lot:x.lot.id, step:x.i, ok, rej, rwk, boxes:toInt(F.boxes), person:F.person.trim(), remark:F.remark.trim()});
      done("Inspection saved · " + n0(ok) + " pcs to FG");
    }});
}

/* ---------- 8. Dispatch ---------- */
function formDisp(pre){
  pre = pre || {};
  const S = STATE, mk = monthKey();
  const c0 = pre.comp ? S.comps.get(pre.comp) : null;
  const F = {cust:pre.cust || (c0 ? c0.cust : "") || "", inv:"", veh:"", date:dayKey(), lines:[{comp:pre.comp || "", qty:""}], remark:""};
  const bal = (cust, comp) => { const r = schedRows(S, mk).find(x => x.cust === cust && x.comp === comp); return r ? r.bal : null; };
  const freeFG = (idx) => { const c = F.lines[idx].comp; const used = sum(F.lines.filter((l, j) => j < idx && l.comp === c), l => toInt(l.qty)); return Math.max(0, fgOf(S, c) - used); };
  const allocText = (idx) => {
    const L = F.lines[idx]; if (!L.comp || !toInt(L.qty)) return "";
    const taken = new Map();
    F.lines.slice(0, idx).forEach(l => { if (l.comp && toInt(l.qty)) allocFIFO(S, l.comp, toInt(l.qty), taken); });
    const a = allocFIFO(S, L.comp, toInt(L.qty), taken);
    return (a.short ? '<span class="hint bad" style="margin:0">Only ' + n0(toInt(L.qty) - a.short) + ' FG available</span> · ' : "") + (a.alloc.length ? "From lots (oldest first): " + a.alloc.map(x => esc((S.lots.get(x.lot) || {}).no) + " (" + n0(x.qty) + ")").join(", ") : "");
  };
  formSheet({title:"Dispatch", hi:"माल डिस्पैच — इनवॉइस", F,
    body:F => {
      let h = fld("Customer", "ग्राहक", pf("cust", partyName(S, F.cust), "", {ph:"Choose customer"}), {req:true});
      h += F.lines.map((L, i) => {
        const c = S.comps.get(L.comp), fg = L.comp ? freeFG(i) : 0, b = L.comp ? bal(F.cust, L.comp) : null;
        return '<div class="box"><div class="row" style="justify-content:space-between"><div class="box-h" style="margin:0">Item ' + (i + 1) + '</div>' + (F.lines.length > 1 ? '<button type="button" class="link" style="color:var(--ink-faint)" data-fa="rmline" data-i="' + i + '">Remove</button>' : "") + '</div><div style="height:8px"></div>' +
          fld("Part", "पार्ट", pf("comp", c ? c.partNo + " · " + c.name : "", c ? "FG ready <b>" + n0(fg) + "</b>" + (b != null ? " · schedule balance <b>" + n0(b) + "</b>" : "") : "", {ph:"Choose part", data:' data-i="' + i + '"'})) +
          fld("Qty", "मात्रा", inNum("lines." + i + ".qty", L.qty, {big:true})) +
          (c ? qbtns([{act:"qall", t:"All FG " + n0(fg), data:' data-i="' + i + '"'}].concat(b != null && b > 0 && b < fg ? [{act:"qbal", t:"Schedule balance " + n0(b), data:' data-i="' + i + '"'}] : [])) : "") +
          '<div class="hint" id="h-a' + i + '">' + allocText(i) + '</div></div>';
      }).join("");
      h += '<button type="button" class="btn btn-sm" data-fa="addline" style="margin-bottom:14px">' + ic("plus") + 'Add another part</button>';
      h += '<div class="frow">' + fld("Invoice no.", "इनवॉइस", inText("inv", F.inv, {cap:true}), {req:true}) + fld("Vehicle no.", "गाड़ी नंबर", inText("veh", F.veh, {cap:true})) + '</div>' + fld("Date", "तारीख", inText("date", F.date, {type:"date"})) + fld("Remarks", "टिप्पणी", inArea("remark", F.remark));
      return h;
    },
    changed:(F, b) => { F.lines.forEach((L, i) => { const el = $("#h-a" + i, F.el); if (el) el.innerHTML = allocText(i); }); },
    summary:F => { const q = sum(F.lines, l => toInt(l.qty)); return q ? "<b>" + F.lines.filter(l => l.comp).length + " " + plural(F.lines.filter(l => l.comp).length, "part") + "</b> · <b>" + n0(q) + "</b> pcs" + (F.cust ? " → " + esc(partyName(S, F.cust)) : "") : ""; },
    act:{
      cust:F => pickParty(["customer"], F.cust, v => { F.cust = v; F.redraw(); }, "Customer"),
      comp:(F, d) => { const i = +d.i; pickComp(F.lines[i].comp, null, v => { F.lines[i].comp = v; if (!F.cust){ const c = S.comps.get(v); if (c) F.cust = c.cust || ""; } F.redraw(); }); },
      qall:(F, d) => { const i = +d.i; F.lines[i].qty = String(freeFG(i)); F.redraw(); },
      qbal:(F, d) => { const i = +d.i; F.lines[i].qty = String(bal(F.cust, F.lines[i].comp)); F.redraw(); },
      addline:F => { F.lines.push({comp:"", qty:""}); F.redraw(); },
      rmline:(F, d) => { F.lines.splice(+d.i, 1); F.redraw(); },
    },
    save:F => {
      if (!F.cust) return fail("Choose the customer");
      if (!F.inv.trim()) return fail("Enter the invoice number");
      const L = F.lines.filter(l => l.comp || toInt(l.qty));
      if (!L.length) return fail("Add a part and qty");
      const taken = new Map(), out = [];
      for (const l of L){
        if (!l.comp) return fail("Choose the part for every item");
        const q = toInt(l.qty); if (q <= 0) return fail("Enter qty for " + compPN(S, l.comp));
        const a = allocFIFO(S, l.comp, q, taken);
        if (a.short) return fail(compPN(S, l.comp) + ": only " + n0(q - a.short) + " FG ready. Record inspection first.");
        out.push({comp:l.comp, qty:q, alloc:a.alloc});
      }
      addEvent("disp", {cust:F.cust, inv:F.inv.trim(), veh:F.veh.trim(), date:F.date || dayKey(), remark:F.remark.trim(), lines:out});
      done("Dispatched " + n0(sum(out, l => l.qty)) + " pcs · inv " + F.inv.trim());
    }});
}

/* ---------- Rework result ---------- */
function formRwk(pre){
  pre = pre || {};
  const S = STATE;
  const F = {key:pre.lot != null ? pre.lot + "|" + pre.step : "", ok:"", rej:"", person:lsGet("pt-last-op", ""), remark:""};
  const cur = () => { if (!F.key) return null; const [lid, i] = F.key.split("|"); const lot = S.lots.get(lid); if (!lot || !lot.calc[+i]) return null; return {lot, i:+i, qty:lot.calc[+i].rwk}; };
  formSheet({title:"Rework result", hi:"रीवर्क — ठीक हुए या स्क्रैप", F,
    body:F => { const x = cur();
      return fld("Lot", "लॉट", pf("lot", x ? x.lot.no + " · " + compPN(S, x.lot.comp) : "", x ? esc(stepName(x.lot, x.i)) + " · " + n0(x.qty) + " on rework hold" : "", {ph:"Choose lot"}), {req:true}) +
        '<div class="qty-grid" style="grid-template-columns:1fr 1fr">' + qtyLine("OK after rework", "ठीक हुए", "ok", F.ok) + qtyLine("Scrapped", "स्क्रैप", "rej", F.rej) + '</div><div style="height:12px"></div>' +
        personField("person", F.person, "Done by", "किसने किया", "op") + fld("Remarks", "टिप्पणी", inArea("remark", F.remark)); },
    act:{ lot:F => pick({title:"Lots on rework hold", items:lotsRework(S).map(w => lotItem(S, w, "on hold")), value:F.key, empty:"Nothing on rework hold", onPick:it => { F.key = it.v; F.redraw(); }}) },
    save:F => {
      const x = cur(); if (!x) return fail("Choose the lot");
      const ok = toInt(F.ok), rej = toInt(F.rej);
      if (ok < 0 || rej < 0 || ok + rej <= 0) return fail("Enter the result");
      if (ok + rej > x.qty) return fail("Only " + n0(x.qty) + " on rework hold");
      rememberName("op", F.person);
      addEvent("rwk", {lot:x.lot.id, step:x.i, ok, rej, person:F.person.trim(), remark:F.remark.trim()});
      done("Rework result saved");
    }});
}

function importCandidates(){
  const have = new Set([...STATE.comps.values()].map(c => norm(c.partNo)));
  const m = new Map();
  for (const d of dies()){ const pn = (d.partNo || "").trim(); if (!pn || have.has(norm(pn))) continue; if (!m.has(norm(pn))) m.set(norm(pn), {partNo:pn, name:d.partName || "", dies:[]}); m.get(norm(pn)).dies.push(d); }
  return [...m.values()];
}
async function importParts(){
  const list = importCandidates(); if (!list.length) return;
  const names = list.slice(0, 12).map(x => esc(x.partNo)).join(", ") + (list.length > 12 ? "…" : "");
  if (!(await confirmBox("Import " + list.length + " parts?", "Creates parts for " + names + " with a draft route from their dies (blanking first, then the other dies, then inspection). Add the customer, material and kg/pc afterwards.", "Import"))) return;
  if (!(await needPin("Import parts from PM Tracker"))) return;
  for (const x of list){
    const ds = x.dies.slice().sort((a, b) => { const ba = /blank|cut|shear/i.test(a.toolName || "") ? 0 : 1, bb = /blank|cut|shear/i.test(b.toolName || "") ? 0 : 1; return ba - bb || String(a.toolNo).localeCompare(String(b.toolNo), undefined, {numeric:true}); });
    const route = ds.map((d, i) => ({id:uid("r"), kind:i === 0 ? "blank" : "press", op:d.toolName || ("Operation " + (i + 1)), die:String(d.toolNo)}));
    route.push({id:uid("r"), kind:"insp", op:"Inspection & packing"});
    addEvent("comp.save", {id:uid("p"), partNo:x.partNo, name:x.name, cust:"", form:"coil", grade:"", thk:0, width:0, len:0, wt:0, pack:0, route, active:true});
  }
  toast("Imported " + list.length + " parts — now complete customer & material", "ok"); render();
}

async function voidEntry(id){
  const S = STATE, e = S.evById.get(id); if (!e || isVoid(S, e)) return;
  const d = e.d || {};
  // block cancelling the entry that created a lot while later entries still depend on it
  const created = [];
  if (e.type === "blank" && d.newLot) created.push(d.lot);
  (d.lines || []).forEach(l => { if (l.newLot) created.push(l.lot); });
  for (const lid of created){
    const deps = S.log.filter(x => x.id !== e.id && !isVoid(S, x) && evTouchesLot(x, lid));
    if (deps.length) return confirmBox("Cancel later entries first", "Lot " + ((S.lots.get(lid) || {}).no || "") + " has " + deps.length + " later " + plural(deps.length, "entry", "entries") + ". Cancel those first (newest first), then this one.", "OK");
  }
  if (e.type === "rm.in"){ const used = (d.coils || []).some(c => { const co = S.coils.get(c.id); return co && co.uses.length; }); if (used) return confirmBox("Coil already used", "Some coils from this receipt are already used in lots. Cancel those blanking entries first.", "OK"); }
  const multi = (d.lines || []).length > 1 ? " This cancels the whole entry (" + d.lines.length + " lots)." : "";
  if (!(await needPin("Cancel entry: " + evInfo(S, e).t))) return;
  const reason = await dialog({title:"Reason for cancelling", msg:"The entry stays in the log, marked cancelled." + multi, input:{ph:"e.g. wrong quantity, entered twice"}, ok:"Cancel entry", danger:true});
  if (reason == null) return;
  addEvent("void", {ref:id, reason:reason.trim()});
  toast("Entry cancelled", "ok"); render();
}

  if (kind === "fg"){ const w = compWip(S); return {name:"fg-stock", head:["Part no.", "Part name", "Customer", "FG", "Inspection queue", "At suppliers", "Press shop"], rows:[...S.comps.values()].map(c => { const x = w.get(c.id) || {fg:0, insp:0, out:0, plant:0}; return [c.partNo, c.name, partyName(S, c.cust), x.fg, x.insp, x.out, x.plant]; })}; }
  if (kind === "disp") return {name:"dispatch-register", head:["Date", "Invoice", "Customer", "Part no.", "Part name", "Qty", "Vehicle", "Lots"],
    rows:S.disp.map(d => [d.date, d.inv, partyName(S, d.cust), compPN(S, d.comp), compName(S, d.comp), d.qty, d.veh, (d.alloc || []).map(a => ((S.lots.get(a.lot) || {}).no || "?") + " (" + a.qty + ")").join("; ")])};

  return {name:"data", head:[], rows:[]};

function downloadCSV(kind){
  if (PREVIEW) return toast("Downloads are off in the preview — use Copy, or the real app file", "bad");

  "void":d => voidEntry(d.id),
  "lot-next":d => {
    const lot = STATE.lots.get(d.id); if (!lot) return;
    const nx = nextAction(STATE, lot); if (!nx) return;
    const pre = nx.f === "disp" ? {comp:lot.comp} : {lot:lot.id, step:nx.i};
    if (nx.f === "recv") pre.party = lot.calc[nx.i].party;
    openForm(nx.f, pre);
  },
  "track-f":d => { UI.trackF = d.f; render(); },
  "go-track":d => { closeAll(); UI.trackF = d.f; UI.trackQ = ""; setTab("track"); },
  "go-stock":d => { closeAll(); UI.stockSeg = d.seg; setTab("stock"); },
  "stock-seg":d => { UI.stockSeg = d.seg; render(); },
  "rm-toggle":d => { UI.rmOpen[d.k] = !UI.rmOpen[d.k]; render(); },
  "coil-close":async d => {
    const co = STATE.coils.get(d.id); if (!co) return;
    const r = await dialog({title:"Close coil " + co.no, msg:kg(co.rem) + " balance will be written off (end bits, returned or scrapped).", input:{ph:"Reason, e.g. end bits / returned to supplier"}, ok:"Close coil", danger:true});
    if (r == null) return;
    addEvent("coil.close", {coil:co.id, kg:Math.round(co.rem * 10) / 10, reason:r.trim()}); toast("Coil closed", "ok"); render();
  },
  "plan-m":d => { UI.planMonth = addMonths(UI.planMonth, +d.d); render(); },
  "sched-new":() => formSched(null),
  "sched-edit":d => formSched(d.id),
  "sched-copy":() => copySchedule(),
  "more":d => openMore(d.p),
  "part-edit":d => formPart(d.id || null),
  "part-import":() => importParts(),
  "party-edit":d => formParty(d.id || null),
  "tools-refresh":async () => { toast("Reading PM Tracker…"); await loadTools(true); toast(TOOLS.err && !isDemo() ? "Could not read: " + TOOLS.err : "Machines & dies updated", TOOLS.err && !isDemo() ? "bad" : "ok"); render(); },
  "sync":() => syncNow(true),
  "sync-open":() => openSyncSheet(),
  "exp-dl":d => downloadCSV(d.k),
  "exp-copy":d => copyTSV(d.k),
  "set-name":() => { const v = (($("#setName") || {}).value || "").trim(); if (!v) return toast("Enter your name", "bad"); lsSet("pt-user", v); toast("Saved — entries will show “" + v + "”", "ok"); render(); },
  "set-pt":() => setPtUrl(),
  "test-pt":() => testUrl((($("#setPt") || {}).value || "").trim() || urls().pt),
  "set-tool":async () => { const o = lsGet("pt-urls", {}) || {}; o.tool = (($("#setTool") || {}).value || "").trim(); lsSet("pt-urls", o); TOOLS.ts = 0; TOOLS.list = []; lsDel("pt-tools"); await loadTools(true); toast(TOOLS.err ? "Could not read PM Tracker: " + TOOLS.err : "Read " + machines().length + " machines, " + dies().length + " dies", TOOLS.err ? "bad" : "ok"); render(); },
  "set-pin":() => changePin(),
  "redownload":async () => { if (!(await confirmBox("Re-download everything?", "Clears this device's copy and downloads all entries again. Entries waiting to upload are kept.", "Re-download"))) return; DB.events = []; DB.ids = new Set(); DB.last = 0; await saveEvents(); rebuild(); render(); syncNow(true); },
  "try-sample":async () => { lsSet("pt-sample", true); closeAll(); await boot(); toast("Sample data loaded", "ok"); },
  "exit-sample":async () => { lsDel("pt-sample"); lsDel("pts-outbox"); try { await kvSet("pts-outbox", []); } catch (e) {} closeAll(); await boot(); toast("Back to your data", "ok"); },
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  try { const r = fn(el.dataset, el, e); if (r && r.catch) r.catch(err => { console.error(err); toast(String(err.message || err), "bad"); }); }
  catch (err){ console.error(err); toast(String(err.message || err), "bad"); }
});
let _qT = null;
document.addEventListener("input", e => {
  if (e.target.id === "trackQ"){
    UI.trackQ = e.target.value;
    clearTimeout(_qT);
    _qT = setTimeout(() => { const pos = e.target.selectionStart; render(); const i = $("#trackQ"); if (i){ i.focus(); try { i.setSelectionRange(pos, pos); } catch (x) {} } }, 220);
  }
});
/* chart tooltips (hover on desktop, tap on phones) */
(function(){
  const tip = () => $("#tip");
  const show = (el, x, y) => { const t = tip(); if (!t) return; t.innerHTML = el.dataset.tip; t.classList.add("show"); const w = t.offsetWidth, h = t.offsetHeight; t.style.left = clamp(x - w / 2, 8, window.innerWidth - w - 8) + "px"; t.style.top = Math.max(8, y - h - 14) + "px"; };
  const hide = () => { const t = tip(); if (t) t.classList.remove("show"); };
  document.addEventListener("pointermove", e => { const el = e.target.closest && e.target.closest("[data-tip]"); if (el) show(el, e.clientX, e.clientY); else hide(); });
  document.addEventListener("pointerdown", e => { const el = e.target.closest && e.target.closest("[data-tip]"); if (el) show(el, e.clientX, e.clientY); else hide(); });
  window.addEventListener("scroll", hide, {passive:true});
})();
window.addEventListener("hashchange", () => { const t = (location.hash || "").slice(1); if (t && t !== UI.tab && TABS.find(x => x.id === t)){ closeAll(); setTab(t); } });
window.addEventListener("online", () => { syncNow(); loadTools(true); });
window.addEventListener("offline", () => { if (MODE === "online") setSync("offline"); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible"){ syncNow(); loadTools(); } });

async function boot(){
  await dbLoad();
  rebuild();
  const h = (location.hash || "").slice(1);
  if (h && TABS.find(x => x.id === h)) UI.tab = h;
  render();
  loadTools().then(() => render());
  if (MODE === "online"){ syncNow(); startSyncLoop(); }
  else { clearInterval(SYNC.timer); setSync(MODE); }
  if (!userName() && !isDemo() && !boot._asked){
    boot._asked = true;
    setTimeout(async () => {
      const n = await dialog({title:"Your name", msg:"Saved with every entry you make, so the log shows who entered what.<br><span class='faint'>आपका नाम — हर एंट्री के साथ सेव होगा</span>", input:{ph:"e.g. Om"}, ok:"Save", cancel:"Later"});
      if (n && n.trim()){ lsSet("pt-user", n.trim()); render(); }
    }, 400);
  }
}
boot().catch(e => { console.error(e); const v = $("#view"); if (v) v.innerHTML = '<div class="empty">Could not start: ' + esc(e.message || e) + '</div>'; });

</script>
