<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161a1e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Production">
<title>Production Tracker — उत्पादन ट्रैकर</title>
<style>
:root{
  --void:#15181c; --panel:#1e2227; --panel-2:#262b31; --panel-3:#2d333a;
  --line:#333941; --line-2:#3e454e;
  --ink:#e9ebee; --ink-dim:#a0a8b2; --ink-faint:#737b86;
  --amber:#e6a417; --amber-dim:#4a3a15;
  --green:#3fb27f; --green-dim:#173729;
  --red:#e0503f; --red-dim:#3d1e1a;
  --steel:#5c8aa6; --steel-dim:#1c2f39;
  --violet:#9a7fd1; --violet-dim:#2c2440;
  /* stage identity colours (categorical, validated on the dark surface) */
  --st-rm:#5c8aa6; --st-plant:#d95926; --st-out:#9085e9; --st-insp:#199e70; --st-fg:#3987e5; --st-done:#6b737d;
  --mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  --sans: -apple-system, system-ui, "Segoe UI", Roboto, "Noto Sans Devanagari", Arial, sans-serif;
  --tabh:62px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--void);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4;}
body{min-height:100vh;}
button{font:inherit;color:inherit;cursor:pointer;}
input,select,textarea{font:inherit;color:inherit;}
::selection{background:var(--amber);color:#1a1206;}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.mono{font-family:var(--mono);}
.hi{color:var(--ink-dim);font-weight:500;}
.muted{color:var(--ink-dim);}
.faint{color:var(--ink-faint);}
.num{font-variant-numeric:tabular-nums;}
.nowrap{white-space:nowrap;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}

/* ---------- shell ---------- */
.side{display:none;}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(9px + var(--safe-t)) 14px 9px;background:linear-gradient(180deg,#1a1e23,#161a1e);border-bottom:3px solid var(--amber);}
.top-hi{font-size:10px;color:var(--amber);letter-spacing:.14em;text-transform:uppercase;font-weight:700;white-space:nowrap;}
.top-t{font-size:18px;font-weight:800;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.top-l{min-width:0;}
.top-r{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.icon-b{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);}
.sync-pill{display:inline-flex;align-items:center;gap:7px;height:34px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:0 12px;font-size:12px;font-weight:700;color:var(--ink-dim);white-space:nowrap;}
.sync-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-faint);}
.sync-pill.ok .dot{background:var(--green);} .sync-pill.pend .dot{background:var(--amber);} .sync-pill.err .dot{background:var(--red);} .sync-pill.local .dot{background:var(--steel);}
.sync-pill.spin .dot{animation:pulse 1s infinite;}
@keyframes pulse{50%{opacity:.25;}}
.banner{margin:10px 12px 0;padding:10px 12px;border-radius:10px;font-size:12.5px;line-height:1.45;border:1px solid var(--steel);background:var(--steel-dim);color:#cfe3ef;display:flex;gap:10px;align-items:flex-start;}
.banner.warn{border-color:var(--amber);background:var(--amber-dim);color:#f6dfa6;}
.banner b{color:#fff;}
.banner .btn{margin-left:auto;flex-shrink:0;}
.view{padding:12px 12px calc(var(--tabh) + var(--safe-b) + 28px);}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);
  height:calc(var(--tabh) + var(--safe-b));padding-bottom:var(--safe-b);background:#171a1f;border-top:1px solid var(--line);}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--ink-faint);letter-spacing:.02em;}
.tab svg.i{width:23px;height:23px;}
.tab.on{color:var(--amber);}
.tab-plus{position:relative;}
.tab-plus .plus-c{width:52px;height:52px;margin-top:-20px;border-radius:50%;background:var(--amber);color:#1a1206;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.45);border:4px solid #171a1f;}
.tab-plus .plus-c svg.i{width:26px;height:26px;stroke-width:2.4;}
.tab-plus span{margin-top:-1px;}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);
  min-height:40px;padding:8px 14px;border-radius:9px;font-size:13.5px;font-weight:700;transition:.12s border-color,.12s background;text-decoration:none;}
.btn:hover{border-color:var(--steel);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-primary{background:var(--amber);color:#1a1206;border-color:var(--amber);}
.btn-primary:hover{background:#f3b431;border-color:#f3b431;}
.btn-ghost{background:transparent;}
.btn-danger{background:transparent;border-color:var(--red);color:#f08a7c;}
.btn-sm{min-height:32px;padding:5px 10px;font-size:12.5px;border-radius:7px;}
.btn-lg{min-height:52px;font-size:16px;border-radius:11px;}
.btn-block{width:100%;}
.link{background:none;border:0;padding:0;color:var(--amber);font-weight:700;font-size:13px;}
.row{display:flex;gap:8px;align-items:center;}
.row.wrap{flex-wrap:wrap;}
.spacer{flex:1;}

/* ---------- panels & dashboard ---------- */
.dash{display:block;}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px;}
.ph h2{margin:0;font-size:14.5px;font-weight:800;letter-spacing:.01em;}
.ph h2 .hi{font-size:12px;margin-left:6px;}
.ph-sub{font-size:12px;color:var(--ink-dim);white-space:nowrap;}
.sec-h{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);margin:18px 2px 8px;}
.sec-h:first-child{margin-top:4px;}

.kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.kpi{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-width:0;}
.kpi-l{font-size:12px;color:var(--ink-dim);font-weight:600;}
.kpi-l .hi{display:block;font-size:11px;color:var(--ink-faint);}
.kpi-v{font-size:26px;font-weight:700;margin-top:4px;letter-spacing:-.01em;line-height:1.1;}
.kpi-v small{font-size:12px;font-weight:600;color:var(--ink-dim);margin-left:3px;letter-spacing:0;}
.kpi-s{font-size:11.5px;color:var(--ink-faint);margin-top:3px;}

/* material flow */
.flow{display:flex;flex-direction:column;gap:0;}
.stage{position:relative;display:flex;align-items:center;gap:12px;padding:10px 6px 10px 2px;background:none;border:0;text-align:left;width:100%;border-radius:8px;}
.stage:hover{background:var(--panel-2);}
.stage .sw{position:relative;z-index:1;width:14px;height:14px;border-radius:50%;flex-shrink:0;margin-left:6px;box-shadow:0 0 0 3px var(--panel);}
.stage::before{content:"";position:absolute;left:14px;top:0;height:50%;width:2px;background:var(--line-2);}
.stage:first-child::before{display:none;}
.stage::after{content:"";position:absolute;left:14px;top:50%;bottom:0;width:2px;background:var(--line-2);}
.stage:last-child::after{display:none;}
.stage .st-txt{flex:1;min-width:0;}
.stage .st-l{font-size:13.5px;font-weight:700;}
.stage .st-l .hi{font-size:11.5px;margin-left:5px;}
.stage .st-sub{font-size:11.5px;color:var(--ink-faint);margin-top:1px;}
.stage .st-v{font-size:19px;font-weight:700;text-align:right;white-space:nowrap;}
.stage .st-v small{font-size:11.5px;color:var(--ink-dim);font-weight:600;margin-left:3px;}
.stage .chev{color:var(--ink-faint);}

/* meters & bars */
.meter{height:10px;border-radius:5px;background:var(--panel-3);overflow:hidden;position:relative;}
.meter>i{display:block;height:100%;border-radius:5px;background:var(--green);}
.meter.amber>i{background:var(--amber);} .meter.red>i{background:var(--red);} .meter.steel>i{background:var(--steel);}
.meter .pace{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.7;}
.seg-bar{display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden;background:var(--panel-3);}
.seg-bar>i{display:block;height:100%;}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--ink-dim);margin-top:8px;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}

/* chips & badges */
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:12.5px;color:var(--ink-dim);font-weight:700;white-space:nowrap;}
.chip.on{border-color:var(--amber);color:var(--amber);background:var(--amber-dim);}
.chip .n{font-family:var(--mono);font-size:11px;margin-left:4px;opacity:.85;}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;letter-spacing:.05em;padding:3px 7px;border-radius:5px;white-space:nowrap;text-transform:uppercase;line-height:1.3;}
.b-ok{background:var(--green-dim);color:#6fd3a5;} .b-warn{background:var(--amber-dim);color:#f2c35a;} .b-bad{background:var(--red-dim);color:#f08a7c;}
.b-steel{background:var(--steel-dim);color:#8fbad3;} .b-violet{background:var(--violet-dim);color:#c3b1ef;} .b-mute{background:var(--panel-3);color:var(--ink-dim);}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;padding:2px 6px;border-radius:4px;background:var(--panel-3);color:var(--ink-dim);text-transform:uppercase;vertical-align:1px;}

/* lists */
.list{display:flex;flex-direction:column;gap:8px;}
.card{position:relative;display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 12px 12px 15px;overflow:hidden;}
button.card:hover{border-color:var(--line-2);}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line-2);}
.card.s-plant::before{background:var(--st-plant);} .card.s-out::before{background:var(--st-out);} .card.s-insp::before{background:var(--st-insp);}
.card.s-fg::before{background:var(--st-fg);} .card.s-closed::before{background:var(--st-done);} .card.s-rm::before{background:var(--st-rm);}
.card.s-bad::before{background:var(--red);} .card.s-warn::before{background:var(--amber);} .card.s-ok::before{background:var(--green);}
.c-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
.c-id{font-family:var(--mono);font-size:12px;color:var(--ink-dim);letter-spacing:.04em;}
.c-title{font-size:15px;font-weight:700;margin-top:2px;line-height:1.3;}
.c-sub{font-size:12.5px;color:var(--ink-dim);margin-top:2px;}
.c-lines{margin-top:8px;display:flex;flex-direction:column;gap:3px;font-size:12.5px;}
.c-line{display:flex;align-items:center;gap:7px;}
.c-line i.sw{width:8px;height:8px;border-radius:2px;flex-shrink:0;}
.c-foot{margin-top:8px;font-size:11.5px;color:var(--ink-faint);display:flex;gap:10px;flex-wrap:wrap;}
.c-big{font-size:20px;font-weight:700;text-align:right;white-space:nowrap;}
.c-big small{display:block;font-size:11px;color:var(--ink-dim);font-weight:600;}
.lrow{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;}
.lrow:last-child{border-bottom:0;}
button.lrow:hover{background:var(--panel-2);}
.lrow .l-main{flex:1;min-width:0;}
.lrow .l-t{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;}
.lrow .l-s{font-size:12px;color:var(--ink-dim);margin-top:1px;}
.lrow .l-r{text-align:right;white-space:nowrap;font-size:14px;font-weight:700;}
.lrow .l-r small{display:block;font-size:11px;color:var(--ink-faint);font-weight:600;}
.l-ico{width:34px;height:34px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink-dim);flex-shrink:0;}
.empty{padding:34px 16px;text-align:center;color:var(--ink-dim);font-size:13.5px;}
.empty .hi{display:block;margin-top:3px;font-size:12.5px;color:var(--ink-faint);}
.empty .btn{margin-top:14px;}
.alert{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);margin-bottom:8px;width:100%;text-align:left;font-size:13px;}
.alert .a-ico{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.alert.bad{border-color:#5a2a23;} .alert.bad .a-ico{background:var(--red-dim);color:var(--red);}
.alert.warn{border-color:#5b4818;} .alert.warn .a-ico{background:var(--amber-dim);color:var(--amber);}
.alert.info .a-ico{background:var(--steel-dim);color:var(--steel);}
.alert b{font-weight:800;}
.alert .a-t{flex:1;min-width:0;}
.alert .a-s{display:block;font-size:11.5px;color:var(--ink-dim);margin-top:1px;}

/* table (desktop + lot detail) */
.tbl-wrap{overflow-x:auto;margin:0 -2px;}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top;}
.tbl tr:last-child td{border-bottom:0;}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
.tbl tr.click{cursor:pointer;} .tbl tr.click:hover td{background:var(--panel-2);}

/* search */
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 12px;height:46px;margin-bottom:10px;}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:16px;height:100%;}
.search svg.i{color:var(--ink-faint);}

/* segmented */
.segc{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;margin-bottom:12px;}
.segc button{flex:1;border:0;background:none;border-radius:7px;padding:9px 6px;font-size:13px;font-weight:700;color:var(--ink-dim);white-space:nowrap;}
.segc button.on{background:var(--panel-3);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2);}
.segc button .hi{display:block;font-size:10.5px;font-weight:600;color:var(--ink-faint);}

/* ---------- layers: sheets, pickers, dialogs ---------- */
.layer{position:fixed;inset:0;z-index:100;}
.layer .bk{position:absolute;inset:0;background:rgba(8,10,12,.62);opacity:0;transition:opacity .18s;}
.layer.in .bk{opacity:1;}
.sheet{position:absolute;inset:0;background:var(--void);display:flex;flex-direction:column;transform:translateY(24px);opacity:0;transition:transform .2s ease,opacity .18s;}
.layer.in .sheet{transform:none;opacity:1;}
.sh-h{display:flex;align-items:center;gap:8px;padding:calc(8px + var(--safe-t)) 10px 8px;background:#191c21;border-bottom:1px solid var(--line);flex-shrink:0;}
.sh-x{width:42px;height:42px;border:0;background:none;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--ink);}
.sh-x:hover{background:var(--panel-2);}
.sh-t{flex:1;min-width:0;}
.sh-title{font-size:16.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sh-hi{font-size:12px;color:var(--ink-dim);}
.sh-b{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 28px;}
.sh-f{flex-shrink:0;padding:10px 14px calc(10px + var(--safe-b));background:#191c21;border-top:1px solid var(--line);}
.sh-f .f-sum{font-size:12px;color:var(--ink-dim);margin-bottom:8px;text-align:center;}
.sh-f .f-sum b{color:var(--ink);}

.pick{position:absolute;left:0;right:0;bottom:0;max-height:86vh;background:var(--panel);border-radius:16px 16px 0 0;border-top:1px solid var(--line-2);display:flex;flex-direction:column;transform:translateY(40px);opacity:0;transition:transform .2s ease,opacity .18s;padding-bottom:var(--safe-b);}
.layer.in .pick{transform:none;opacity:1;}
.pick-h{padding:12px 14px 8px;display:flex;align-items:center;gap:8px;}
.pick-h .grab{position:absolute;left:50%;top:6px;width:38px;height:4px;border-radius:2px;background:var(--line-2);transform:translateX(-50%);}
.pick-title{flex:1;font-size:15.5px;font-weight:800;}
.pick-title .hi{display:block;font-size:12px;font-weight:500;}
.pick .search{margin:0 14px 8px;}
.pick-list{overflow-y:auto;padding:0 8px 12px;}
.pick-g{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);padding:10px 8px 4px;}
.pick-it{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:9px;padding:11px 8px;min-height:52px;}
.pick-it:hover,.pick-it:focus-visible{background:var(--panel-2);outline:none;}
.pick-it.sel{background:var(--amber-dim);}
.pick-it .p-main{flex:1;min-width:0;}
.pick-it .p-t{font-size:14.5px;font-weight:700;}
.pick-it .p-s{font-size:12px;color:var(--ink-dim);margin-top:1px;}
.pick-it.dis{opacity:.5;}
.pick-add{color:var(--amber);font-weight:800;}

.dlg{position:absolute;left:50%;top:50%;width:min(420px,calc(100% - 28px));transform:translate(-50%,-46%) scale(.98);opacity:0;transition:transform .18s,opacity .18s;background:var(--panel);border:1px solid var(--line-2);border-radius:14px;padding:18px;}
.layer.in .dlg{transform:translate(-50%,-50%);opacity:1;}
.dlg h3{margin:0 0 4px;font-size:17px;}
.dlg p{margin:0 0 12px;color:var(--ink-dim);font-size:13.5px;line-height:1.5;}
.dlg .in{margin-bottom:6px;}
.dlg-a{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;}
.dlg-a .btn{min-width:96px;}
.pin-in{letter-spacing:10px;text-align:center;font-size:24px !important;font-family:var(--mono);}

/* ---------- forms ---------- */
.fld{margin-bottom:14px;}
.fld>label,.fld>.lbl{display:block;font-size:12px;font-weight:700;color:var(--ink-dim);margin-bottom:6px;letter-spacing:.01em;}
.fld>label .hi,.fld>.lbl .hi{font-weight:500;color:var(--ink-faint);margin-left:5px;}
.fld .req{color:var(--amber);margin-left:3px;}
.in{width:100%;min-height:48px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;outline:none;}
.in:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(230,164,23,.15);}
.in.big{font-size:24px;font-weight:700;font-family:var(--mono);min-height:56px;letter-spacing:.02em;}
.in.err{border-color:var(--red);}
textarea.in{min-height:70px;resize:vertical;}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-dim) 50%),linear-gradient(135deg,var(--ink-dim) 50%,transparent 50%);background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px;}
input[type="date"].in{color-scheme:dark;}
.frow{display:flex;gap:10px;}
.frow>.fld{flex:1;min-width:0;}
.hint{font-size:12px;color:var(--ink-dim);margin-top:6px;line-height:1.45;}
.hint.bad{color:#f08a7c;} .hint.warn{color:#f2c35a;} .hint.ok{color:#6fd3a5;}
.hint b{color:var(--ink);}

<script>
/* ---- 00-config.js ---- */
"use strict";
/* =====================================================================================
   PRODUCTION TRACKER — material tracking from RM inward to dispatch
   -------------------------------------------------------------------------------------
   SETUP: paste your URLs below (or enter them later in the app: More → Settings).
   ===================================================================================== */

// 1) NEW Google Apps Script web app for production data (the Code.gs supplied with this file).
//    Ends in /exec. Leave "" to keep data on this device only until you connect.
const PT_BACKEND_URL = "https://script.google.com/macros/s/AKfycbwKKBSEEXmCFI70sKF9bNv3RPkZCWxYy4OrnI_lTwPfQNedAVnD685DxGbVcSlvqZaJDA/exec";

// 2) Your existing Tool PM Tracker backend. Machines & dies are READ from here (never written).

/* ===================================================================================== */
const PREVIEW = false;          // true only in the hosted preview build (sample data, no server)
const APP_VER = "1.0";
const DEFAULT_PIN = "1234";     // manager PIN until changed in Settings (same default as PM Tracker)
const SYNC_EVERY_MS = 90 * 1000;

/* ---- 01-util.js ---- */
/* ---------------- small helpers ---------------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
function esc(s){ return (s == null ? "" : String(s)).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function uid(p){ return (p || "") + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
const NF0 = new Intl.NumberFormat("en-IN", {maximumFractionDigits: 0});
const NF1 = new Intl.NumberFormat("en-IN", {maximumFractionDigits: 1});
const NF3 = new Intl.NumberFormat("en-IN", {maximumFractionDigits: 3});
function n0(x){ return NF0.format(Math.round(+x || 0)); }
function n3(x){ return NF3.format(+x || 0); }
function kgs(x){ x = +x || 0; return Math.abs(x) >= 100 ? NF0.format(Math.round(x)) : NF1.format(x); }
function kg(x){ return kgs(x) + " kg"; }
function toNum(v){ const x = parseFloat(String(v == null ? "" : v).replace(/,/g, "")); return isFinite(x) ? x : 0; }
function toInt(v){ return Math.round(toNum(v)); }
function pad2(n){ return String(n).padStart(2, "0"); }
function dayKey(d){ d = d ? new Date(d) : new Date(); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function monthKey(d){ return dayKey(d).slice(0, 7); }
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtD(x){ const d = new Date(x); return pad2(d.getDate()) + " " + MON[d.getMonth()]; }
function fmtDY(x){ const d = new Date(x); return pad2(d.getDate()) + " " + MON[d.getMonth()] + " " + d.getFullYear(); }
function fmtT(x){ const d = new Date(x); return pad2(d.getHours()) + ":" + pad2(d.getMinutes()); }
function fmtDT(x){ return fmtD(x) + ", " + fmtT(x); }
function dateOnly(k){ const [y, m, d] = String(k).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); }
function fmtDayKey(k){ return fmtD(dateOnly(k)); }
function monthLabel(mk){ const [y, m] = mk.split("-"); return MON[+m - 1] + " " + y; }
function addMonths(mk, n){ const [y, m] = mk.split("-").map(Number); return monthKey(new Date(y, m - 1 + n, 1)); }
function daysInMonth(mk){ const [y, m] = mk.split("-").map(Number); return new Date(y, m, 0).getDate(); }
function daysSince(x){ return Math.max(0, Math.floor((Date.now() - new Date(x)) / 864e5)); }
function ago(x){
  const m = Math.round((Date.now() - new Date(x)) / 60000);
  if (m < 1) return "just now"; if (m < 60) return m + " min ago";
  const h = Math.round(m / 60); if (h < 24) return h + " h ago";
  return Math.round(h / 24) + " d ago";
}
function dur(ms){ const m = Math.max(0, Math.round(ms / 60000)); const d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mm = m % 60;
  return ((d ? d + " d " : "") + (h ? h + " h " : "") + ((!d && (mm || !h)) ? mm + " min" : "")).trim(); }
function shiftNow(d){ const h = (d ? new Date(d) : new Date()).getHours(); return h >= 6 && h < 14 ? "A" : h >= 14 && h < 22 ? "B" : "C"; }
const C32 = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function code(n){ let s = ""; for (let i = 0; i < n; i++) s += C32[Math.floor(Math.random() * 32)]; return s; }
function yymmdd(d){ const k = dayKey(d); return k.slice(2, 4) + k.slice(5, 7) + k.slice(8, 10); }
function autoLotNo(){ return yymmdd() + "-" + code(3); }
function autoCoilNo(){ return "C" + yymmdd() + "-" + code(3); }
function hashPin(p){ let h = 0x811c9dc5; for (const ch of String(p)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 0x01000193) >>> 0; } return "p" + h.toString(16); }
function lsGet(k, def){ try { const v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
function lsDel(k){ try { localStorage.removeItem(k); } catch (e) {} }
function sum(a, f){ let s = 0; for (const x of a) s += f ? (+f(x) || 0) : (+x || 0); return s; }
function clamp(x, a, b){ return Math.max(a, Math.min(b, x)); }
function pct(a, b){ return b > 0 ? a / b * 100 : 0; }
function fmtPct(x, d){ return (isFinite(x) ? x : 0).toFixed(d == null ? 0 : d) + "%"; }
function plural(n, one, many){ return n === 1 ? one : (many || one + "s"); }
function norm(s){ return String(s || "").trim().toLowerCase(); }

/* ---- 03-data.js ---- */
/* =====================================================================================
   DATA — local cache (IndexedDB, falls back to localStorage), outbox for offline entries,
   sync with the Google Sheet backend, and read-only machine/die data from PM Tracker.
   ===================================================================================== */
let MODE = "local";            // preview | sample | local | online
let NS = "pt";                 // storage namespace (sample data lives under "pts")
const DB = { events:[], outbox:[], last:0, ids:new Set(), url:"" };
let STATE = buildState([]);
const TOOLS = { list:[], ts:0, err:"", loading:false };
const SYNC = { state:"idle", msg:"", lastOk:0, busy:false, again:false, timer:null, debounce:null };

function urls(){
  const o = lsGet("pt-urls", {}) || {};
  return { pt: (o.pt || PT_BACKEND_URL || "").trim(), tool: (o.tool != null && o.tool !== "" ? o.tool : TOOL_BACKEND_URL || "").trim() };
}
function computeMode(){
  if (PREVIEW) return "preview";
  if (lsGet("pt-sample", false)) return "sample";
  return urls().pt ? "online" : "local";
}
function isDemo(){ return MODE === "preview" || MODE === "sample"; }
function deviceId(){ let d = lsGet("pt-dev", ""); if (!d){ d = "d" + code(6).toLowerCase(); lsSet("pt-dev", d); } return d; }
function userName(){ return lsGet("pt-user", "") || ""; }

/* ---------- IndexedDB key/value with localStorage fallback ---------- */
let _idbP = null;
function idb(){
  if (_idbP) return _idbP;
  _idbP = new Promise((res, rej) => {
    let done = false;
    const to = setTimeout(() => { if (!done){ done = true; rej(new Error("idb timeout")); } }, 2500);
    try {
      const r = indexedDB.open("production-tracker", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => { if (!done){ done = true; clearTimeout(to); res(r.result); } };
      r.onerror = () => { if (!done){ done = true; clearTimeout(to); rej(r.error); } };
    } catch (e){ done = true; clearTimeout(to); rej(e); }
  });
  return _idbP;
}
async function kvGet(k){
  try { const db = await idb(); return await new Promise((res, rej) => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
  catch (e){ return lsGet(k, undefined); }
}
async function kvSet(k, v){
  try { const db = await idb(); await new Promise((res, rej) => { const tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); return true; }
  catch (e){ return lsSet(k, v); }
}

/* ---------- load / save ---------- */
async function dbLoad(){
  MODE = computeMode();
  NS = isDemo() ? "pts" : "pt";
  DB.events = []; DB.ids = new Set(); DB.last = 0; DB.outbox = [];
  // outbox: keep both copies and merge, so an entry is never lost
  const ob1 = (await kvGet(NS + "-outbox")) || [], ob2 = lsGet(NS + "-outbox", []) || [];
  const seen = new Set();
  for (const e of [...ob1, ...ob2]) if (e && e.id && !seen.has(e.id)){ seen.add(e.id); DB.outbox.push(e); }
  DB.outbox.sort((a, b) => a.ts < b.ts ? -1 : 1);
  if (isDemo()){
    DB.events = sampleEvents();
  } else {
    const u = urls().pt;
    const cachedUrl = (await kvGet(NS + "-url")) || "";
    if (u && cachedUrl === u){
      DB.events = (await kvGet(NS + "-events")) || [];
      DB.last = (await kvGet(NS + "-last")) || 0;
    }
    DB.url = u;
  }
  for (const e of DB.events) DB.ids.add(e.id);
}
async function saveEvents(){ if (isDemo()) return; await kvSet(NS + "-events", DB.events); await kvSet(NS + "-last", DB.last); await kvSet(NS + "-url", DB.url); }
async function saveOutbox(){ lsSet(NS + "-outbox", DB.outbox); await kvSet(NS + "-outbox", DB.outbox); }

function rebuild(){
  const pend = DB.outbox.filter(e => !DB.ids.has(e.id));
  STATE = buildState(DB.events.concat(pend));
  return STATE;
}

/* ---------- create an entry ---------- */
function addEvent(type, d){
  const ev = { id:uid("e"), type, ts:new Date().toISOString(), by:userName() || "—", dev:deviceId(), d };
  try { ev.rows = rowsFor(STATE, ev); } catch (e){ ev.rows = []; }
  DB.outbox.push(ev);
  saveOutbox();
  rebuild();
  try { navigator.vibrate && navigator.vibrate(12); } catch (e) {}
  scheduleSync(800);
  return ev;
}
function rememberName(list, name){
  name = String(name || "").trim(); if (!name) return;
  const k = "pt-names-" + list, a = lsGet(k, []) || [];
  lsSet(k, [name, ...a.filter(x => norm(x) !== norm(name))].slice(0, 30));
}
function namesFor(list){
  const a = lsGet("pt-names-" + list, []) || [];
  const fromLog = [];
  for (let i = STATE.log.length - 1; i >= 0 && fromLog.length < 60; i--){ const p = (STATE.log[i].d || {}).person; if (p) fromLog.push(p); }
  const out = [], seen = new Set();
  for (const n of [...a, ...fromLog]) if (!seen.has(norm(n))){ seen.add(norm(n)); out.push(n); }
  return out.slice(0, 40);
}

/* ---------- backend calls ---------- */
async function fetchTO(url, opts, ms){
  const ctl = typeof AbortController !== "undefined" ? new AbortController() : null;
  const t = ctl ? setTimeout(() => ctl.abort(), ms || 30000) : null;
  try { return await fetch(url, Object.assign({}, opts, ctl ? {signal:ctl.signal} : {})); }
  finally { if (t) clearTimeout(t); }
}
async function ptCall(action, params, urlOverride){
  const url = urlOverride || urls().pt;
  if (!url) throw new Error("Google Sheet not connected");
  const body = new URLSearchParams();
  body.set("action", action);
  for (const k in (params || {})) body.set(k, typeof params[k] === "string" ? params[k] : JSON.stringify(params[k]));
  const r = await fetchTO(url, {method:"POST", body, redirect:"follow"}, 45000);
  let j; try { j = await r.json(); } catch (e){ throw new Error("Server reply was not JSON — check the web app URL and that access is set to “Anyone”"); }
  if (!j || j.ok === false) throw new Error((j && j.error) || "Server error");
  return j;
}
async function pullAll(){
  let guard = 0, more = true;
  while (more && guard++ < 60){
    const r = await ptCall("pull", {since:String(DB.last), limit:"1500"});
    const evs = r.events || [];
    for (const ev of evs){
      if (ev.seq && ev.seq > DB.last) DB.last = ev.seq;
      if (DB.ids.has(ev.id)) continue;
      DB.events.push(ev); DB.ids.add(ev.id);
    }
    if (typeof r.last === "number" && r.last < DB.last && !evs.length){
      // the sheet has fewer rows than our cache: it was reset or replaced → re-download everything
      DB.events = []; DB.ids = new Set(); DB.last = 0; more = true; continue;
    }
    if (evs.length) await saveEvents();
    more = !!r.more && evs.length > 0;
  }
}
function setSync(state, msg){ SYNC.state = state; SYNC.msg = msg || ""; renderSync(); }
async function syncNow(manual){
  if (MODE !== "online"){ setSync(MODE); if (manual) toast(isDemo() ? "Sample data — nothing to sync" : "Connect the Google Sheet in Settings first"); return; }
  if (SYNC.busy){ SYNC.again = true; return; }
  SYNC.busy = true; setSync("syncing");
  try {
    await pullAll();
    let rounds = 0;
    while (DB.outbox.length && rounds++ < 20){
      const pend = DB.outbox.filter(e => !DB.ids.has(e.id));
      if (!pend.length) break;
      const batch = pend.slice(0, 80);
      const r = await ptCall("push", {events:JSON.stringify(batch)});
      if (r.rejected && r.rejected.length){
        // keep a copy for troubleshooting, drop from the outbox so it doesn't retry forever
        const bad = new Set(r.rejected.map(x => x && x.id).filter(Boolean));
        const keep = (lsGet("pt-rejected", []) || []).concat(DB.outbox.filter(e => bad.has(e.id))).slice(-50);
        lsSet("pt-rejected", keep);
        DB.outbox = DB.outbox.filter(e => !bad.has(e.id));
        toast(r.rejected.length + " " + plural(r.rejected.length, "entry", "entries") + " rejected by the server: " + (r.rejected[0].error || "invalid"), "bad");
      }
      await pullAll();
      DB.outbox = DB.outbox.filter(e => !DB.ids.has(e.id));
      await saveOutbox();
      if (pend.length <= batch.length) break;
    }
    DB.outbox = DB.outbox.filter(e => !DB.ids.has(e.id));
    await saveOutbox();
    SYNC.lastOk = Date.now(); lsSet("pt-lastsync", SYNC.lastOk);
    setSync(DB.outbox.length ? "pend" : "ok");
  } catch (e){
    setSync((typeof navigator !== "undefined" && navigator.onLine === false) ? "offline" : "error", String(e && e.message || e));
  } finally {
    SYNC.busy = false;
    rebuild(); render();
    if (SYNC.again){ SYNC.again = false; setTimeout(() => syncNow(), 600); }
  }
}
function scheduleSync(ms){
  clearTimeout(SYNC.debounce);
  SYNC.debounce = setTimeout(() => syncNow(), ms || 1000);
  renderSync();
}
function startSyncLoop(){
  clearInterval(SYNC.timer);
  SYNC.timer = setInterval(() => { if (document.visibilityState === "visible") { syncNow(); loadTools(); } }, SYNC_EVERY_MS);
}

const TOOL_FIELDS = ["id","category","toolNo","toolName","toolNameHi","partName","partNo","threshold","unit","strokesSincePM","lifetimeStrokes","lastPMDate","startDate","intervalValue","intervalUnit","openBreakdownId","downSince"];
async function loadTools(force){
  if (isDemo()){ TOOLS.list = sampleTools(); TOOLS.ts = Date.now(); TOOLS.err = ""; return; }
  const c = lsGet("pt-tools", null);
  if (c && Array.isArray(c.list) && !TOOLS.list.length){ TOOLS.list = c.list; TOOLS.ts = c.ts || 0; }
  const url = urls().tool;
  if (!url){ TOOLS.err = "PM Tracker URL not set"; return; }
  if (!force && TOOLS.ts && Date.now() - TOOLS.ts < 4 * 60e3) return;
  if (TOOLS.loading) return;
  TOOLS.loading = true;
  try {
    const fd = new FormData(); fd.append("action", "get"); fd.append("key", "tools-list");
    const r = await fetchTO(url, {method:"POST", body:fd}, 30000);
    const j = await r.json();
    if (!j || !j.ok) throw new Error((j && j.error) || "no data");

}

function dies(){ return TOOLS.list.filter(t => !isMachine(t)).sort((a, b) => String(a.toolNo).localeCompare(String(b.toolNo), undefined, {numeric:true})); }
function machineByNo(no){ return machines().find(m => String(m.toolNo) === String(no)) || null; }
function dieByNo(no){ return dies().find(d => String(d.toolNo) === String(no)) || null; }

/* =====================================================================================

   finished goods, dispatches) is rebuilt by replaying events in order.

   never change history.

const EV = {
  "rm.in":     {en:"RM inward", hi:"कच्चा माल आवक", st:"rm"},
  "setup":     {en:"Die setup", hi:"डाई सेटअप", st:"plant"},

  "out.recv":  {en:"Received back", hi:"वापस आया", st:"out"},
  "insp":      {en:"Inspection & packing", hi:"निरीक्षण व पैकिंग", st:"insp"},
  "disp":      {en:"Dispatch", hi:"डिस्पैच", st:"fg"},
  "coil.close":{en:"Coil closed", hi:"कॉइल बंद", st:"rm"},
  "void":      {en:"Entry cancelled", hi:"एंट्री रद्द", st:""},
  "comp.save": {en:"Part master saved", hi:"पार्ट मास्टर", st:""},
  "party.save":{en:"Party saved", hi:"पार्टी", st:""},
  "sched.save":{en:"Schedule saved", hi:"शेड्यूल", st:""},
  "cfg":       {en:"Settings changed", hi:"सेटिंग", st:""},
};
const TX_TYPES = new Set(["rm.in","setup","blank","op","rwk","out.send","out.recv","insp","disp","coil.close"]);
const Z_STEP = {ok:0, rej:0, rwk:0, sent:0};

function newState(){
  return { comps:new Map(), parties:new Map(), scheds:new Map(), coils:new Map(), grns:[], lots:new Map(),
    mc:{}, mcLast:{}, disp:[], log:[], cfg:{}, voided:new Set(), voidBy:new Map(), warn:[], evById:new Map() };
}

function buildState(events){
  const S = newState();
  for (const e of events) if (e && e.type === "void" && e.d && e.d.ref){ S.voided.add(e.d.ref); S.voidBy.set(e.d.ref, e); }
  for (const e of events){
    if (!e || !e.type || !e.id) continue;
    if (S.evById.has(e.id)) continue;           // duplicate delivery
    S.evById.set(e.id, e);
    if (TX_TYPES.has(e.type) || e.type === "void") S.log.push(e);
    if (S.voided.has(e.id)) continue;
    try { applyEv(S, e); }
    catch (err){ S.warn.push({id:e.id, type:e.type, msg:String(err && err.message || err)}); }
  }
  for (const lot of S.lots.values()) calcLot(S, lot);
  for (const c of S.coils.values()){
    c.rem = c.done ? 0 : Math.max(0, c.kg - c.used);
    c.status = c.done ? "done" : c.used > 0.001 ? "used" : "full";
  }
  return S;
}

function getStep(lot, i){
  i = +i || 0;
  if (i < 0 || i >= lot.route.length) throw new Error("Step " + (i + 1) + " not in route of lot " + lot.no);
  return lot.steps[i] || (lot.steps[i] = {ok:0, rej:0, rwk:0, sent:0});
}
function makeLot(S, id, no, comp, route, ts){
  if (!id) throw new Error("Lot id missing");
  if (S.lots.has(id)) return S.lots.get(id);
  if (!Array.isArray(route) || !route.length) throw new Error("Route missing for new lot");
  const lot = {id, no: no || id, comp, route: route.map(r => Object.assign({}, r)), ts, steps:[], coils:[], kg:0,
    disp:0, dispList:[], sends:[], hist:[], boxes:0};
  S.lots.set(id, lot);
  return lot;
}
function needLot(S, id){ const l = S.lots.get(id); if (!l) throw new Error("Unknown lot"); return l; }
function useCoil(S, lot, coilId, kgUsed, done, e){
  if (!coilId) return;
  const c = S.coils.get(coilId);
  if (!c){ S.warn.push({id:e.id, type:e.type, msg:"Unknown coil"}); return; }
  kgUsed = +kgUsed || 0;
  c.used += kgUsed; if (done) c.done = true;
  c.uses.push({lot: lot.id, kg: kgUsed, ts: e.ts, ev: e.id});
  const lc = lot.coils.find(x => x.coil === coilId);
  if (lc) lc.kg += kgUsed; else lot.coils.push({coil: coilId, kg: kgUsed});
  lot.kg += kgUsed;
}
function hist(lot, e, step, q){ lot.hist.push(Object.assign({id:e.id, ts:e.ts, type:e.type, by:e.by, step}, q || {})); }
function mcCount(S, mc, comp, step, qty, ts){
  if (!mc) return;
  const m = S.mc[mc];
  if (m && m.comp === comp && +m.step === +step) m.qty += qty;
  S.mcLast[mc] = {ts, comp, step, qty};
}
const N = v => +v || 0;

function applyEv(S, e){
  const d = e.d || {};
  switch (e.type){
    case "comp.save": if (!d.id) throw new Error("part id missing"); S.comps.set(d.id, Object.assign({}, d, {savedAt:e.ts})); break;
    case "party.save": if (!d.id) throw new Error("party id missing"); S.parties.set(d.id, Object.assign({}, d)); break;
    case "sched.save": if (!d.id) throw new Error("schedule id missing");
      if (d.del || !(N(d.qty) > 0)) S.scheds.delete(d.id); else S.scheds.set(d.id, Object.assign({}, d, {qty:N(d.qty)})); break;
    case "cfg": Object.assign(S.cfg, d); break;
    case "void": break;

    case "rm.in": {
      const g = {id:e.id, ts:e.ts, date:d.date || dayKey(e.ts), party:d.party, doc:d.doc || "", form:d.form || "coil",
        grade:d.grade || "", thk:N(d.thk), width:N(d.width), len:N(d.len), coils:[]};
      for (const c of (d.coils || [])){
        if (!c.id) continue;
        S.coils.set(c.id, {id:c.id, no:c.no || c.id, kg:N(c.kg), used:0, heat:c.heat || "", grn:e.id, doc:g.doc, party:g.party,
          form:g.form, grade:g.grade, thk:g.thk, width:g.width, len:g.len, date:g.date, ts:e.ts, done:false, uses:[], closeKg:0});
        g.coils.push(c.id);
      }
      S.grns.push(g); break;
    }
    case "coil.close": {
      const c = S.coils.get(d.coil); if (!c) throw new Error("Unknown coil");
      c.done = true; c.closeKg = N(d.kg); c.closeReason = d.reason || ""; c.closedAt = e.ts; break;
    }
    case "setup":
      if (!d.mc) throw new Error("machine missing");
      S.mc[d.mc] = {mc:d.mc, die:d.die || "", comp:d.comp, step:N(d.step), ts:e.ts, by:d.person || e.by, qty:0, ev:e.id};
      break;
    case "blank": {
      let lot = S.lots.get(d.lot);
      if (!lot){ if (!d.newLot) throw new Error("Unknown lot"); lot = makeLot(S, d.lot, d.lotNo, d.comp, d.route, e.ts); }
      const s = getStep(lot, 0); s.ok += N(d.ok); s.rej += N(d.rej);
      useCoil(S, lot, d.coil, d.kg, d.coilDone, e);
      mcCount(S, d.mc, lot.comp, 0, N(d.ok) + N(d.rej), e.ts);
      hist(lot, e, 0, {ok:N(d.ok), rej:N(d.rej), kg:N(d.kg), coil:d.coil, mc:d.mc, die:d.die, person:d.person, shift:d.shift});
      break;
    }
    case "op": {
      const lot = needLot(S, d.lot); const s = getStep(lot, d.step);
      s.ok += N(d.ok); s.rej += N(d.rej); s.rwk += N(d.rwk);
      mcCount(S, d.mc, lot.comp, N(d.step), N(d.ok) + N(d.rej) + N(d.rwk), e.ts);
      hist(lot, e, N(d.step), {ok:N(d.ok), rej:N(d.rej), rwk:N(d.rwk), mc:d.mc, die:d.die, person:d.person, shift:d.shift});
      break;
    }
    case "rwk": {
      const lot = needLot(S, d.lot); const s = getStep(lot, d.step);
      s.rwk -= N(d.ok) + N(d.rej); s.ok += N(d.ok); s.rej += N(d.rej);
      hist(lot, e, N(d.step), {ok:N(d.ok), rej:N(d.rej), person:d.person});
      break;
    }
    case "out.send": {
      for (const L of (d.lines || [])){
        let lot = S.lots.get(L.lot);
        if (!lot){ if (!L.newLot) throw new Error("Unknown lot"); lot = makeLot(S, L.lot, L.lotNo, L.comp, L.route, e.ts); }
        const s = getStep(lot, L.step); s.sent += N(L.qty);
        if (L.coil) useCoil(S, lot, L.coil, L.kg, L.coilDone, e);
        lot.sends.push({step:N(L.step), qty:N(L.qty), party:d.party, ts:e.ts, doc:d.doc || ""});
        hist(lot, e, N(L.step), {qty:N(L.qty), party:d.party, doc:d.doc, kg:N(L.kg)});
      }
      break;
    }
    case "out.recv": {
      for (const L of (d.lines || [])){
        let lot = S.lots.get(L.lot);
        if (!lot){
          if (!L.newLot) throw new Error("Unknown lot");
          lot = makeLot(S, L.lot, L.lotNo, L.comp, L.route, e.ts);
          getStep(lot, 0).sent += N(L.ok) + N(L.rej);      // bought-out: arrives without a send
          lot.sends.push({step:0, qty:N(L.ok) + N(L.rej), party:d.party, ts:e.ts, doc:d.doc || ""});
        }
        const s = getStep(lot, L.step); s.ok += N(L.ok); s.rej += N(L.rej);
        hist(lot, e, N(L.step), {ok:N(L.ok), rej:N(L.rej), party:d.party, doc:d.doc});
      }
      break;
    }
    case "insp": {
      const lot = needLot(S, d.lot); const s = getStep(lot, d.step);
      s.ok += N(d.ok); s.rej += N(d.rej); s.rwk += N(d.rwk); lot.boxes += N(d.boxes);
      hist(lot, e, N(d.step), {ok:N(d.ok), rej:N(d.rej), rwk:N(d.rwk), person:d.person, boxes:N(d.boxes)});
      break;
    }
    case "disp": {
      const date = d.date || dayKey(e.ts);
      for (const L of (d.lines || [])){
        for (const a of (L.alloc || [])){
          const lot = S.lots.get(a.lot); if (!lot) continue;
          lot.disp += N(a.qty);
          lot.dispList.push({ts:e.ts, date, inv:d.inv || "", cust:d.cust, qty:N(a.qty), ev:e.id});
          hist(lot, e, null, {qty:N(a.qty), party:d.cust, doc:d.inv});
        }
        S.disp.push({id:e.id, ts:e.ts, date, cust:d.cust, comp:L.comp, qty:N(L.qty), inv:d.inv || "", veh:d.veh || "", alloc:L.alloc || []});
      }
      break;
    }
    default: break;
  }
}

/* ----- per-lot quantities ----- */
function calcLot(S, lot){
  const R = lot.route, n = R.length;
  let prevOk = 0, rejT = 0;
  lot.anom = [];
  lot.calc = R.map((r, i) => {
    const s = lot.steps[i] || Z_STEP;
    const isOut = r.kind === "out";
    const proc = isOut ? s.sent : s.ok + s.rej + s.rwk;
    const input = i === 0 ? proc : prevOk;

    if (c.rwk > 0) lot.bk.push({stage: c.kind === "insp" ? "insp" : "plant", type:"rwk", i:c.i, qty:c.rwk});

  lot.status = active.length ? "wip" : lot.fg > 0 ? "fg" : "closed";
  lot.stage = active.length ? active[0].stage : lot.status === "fg" ? "fg" : "closed";
  lot.lastTs = lot.hist.length ? lot.hist[lot.hist.length - 1].ts : lot.ts;
}

/* ----- form candidates ----- */
function lotsWaiting(S, kinds){

}
function lotsAtSupplier(S, party){

function lotsRework(S){

function fgLots(S, comp){ return [...S.lots.values()].filter(l => l.comp === comp && l.fg > 0).sort((a, b) => a.ts < b.ts ? -1 : 1); }

/* FIFO allocation of a dispatch qty to finished-goods lots; `taken` holds qty already used in this invoice */

    alloc.push({lot:l.id, qty:q}); taken.set(l.id, (taken.get(l.id) || 0) + q); left -= q;
  }

/* ----- dashboard numbers ----- */
function compWip(S){

function pipeline(S, mk){

function rejByOp(S, mk){

  for (const e of S.log){

    if (e.type === "blank" || e.type === "op" || e.type === "insp" || e.type === "rwk"){
      const lot = S.lots.get(d.lot); if (!lot) continue;

    } else if (e.type === "out.recv"){

const SCHED_ST = {

  wip:  {en:"Behind — in WIP", hi:"पीछे — WIP में", cls:"b-warn"},
  fg:   {en:"Dispatch due — FG ready", hi:"माल तैयार — डिस्पैच करें", cls:"b-warn"},
  ok:   {en:"On track", hi:"समय पर", cls:"b-ok"},
  done: {en:"Completed", hi:"पूरा", cls:"b-ok"},

function schedRows(S, mk, todayK){
  todayK = todayK || dayKey();

    const k = d.cust + "|" + d.comp;

/* ----- Tool PM Tracker (read-only) ----- */
function isMachine(t){ return (t && t.category || "die") === "machine"; }

function toolPM(t){
  if (!t) return {code:"ok", label:"", text:""};
  if (isMachine(t)){
    if (!t.intervalValue) return {code:"ok", label:"OK", text:""};
    const base = new Date(t.lastPMDate || t.startDate || Date.now());
    const due = addInterval(base, +t.intervalValue || 1, t.intervalUnit || "months");
    const total = due - base, el = Date.now() - base, p = total > 0 ? el / total * 100 : 100;
    if (el >= total) return {code:"over", label:"PM overdue", text:"PM was due " + fmtD(due)};
    if (p >= 85) return {code:"soon", label:"PM due soon", text:"PM due " + fmtD(due)};
    return {code:"ok", label:"OK", text:"Next PM " + fmtD(due)};
  }
  const th = +t.threshold || 0, sp = +t.strokesSincePM || 0, p = th > 0 ? sp / th * 100 : 0;
  const text = n0(sp) + " / " + n0(th) + " strokes since PM";
  if (th > 0 && sp >= th) return {code:"over", label:"PM overdue", text};

    case "disp": return (d.lines || []).map(L => R((L.alloc || []).map(a => { const l = S.lots.get(a.lot); return (l ? l.no : "?") + " (" + a.qty + ")"; }).join(", "),
      L.comp, "", L.qty, "", "", "", "", "", partyName(S, d.cust), d.inv, [d.veh ? "Vehicle " + d.veh : "", d.remark].filter(Boolean).join(" · ")));
    case "coil.close": { const c = S.coils.get(d.coil); return [R(c ? c.no : "", null, c ? specLabel(c) : "", "", "", d.kg, "", "", "", "", "", d.reason)]; }
    case "void": { const r = S.evById.get(d.ref); return [R(r ? (EV[r.type] || {en:r.type}).en : d.ref, null, "", "", "", "", "", "", "", "", d.ref, "CANCELLED · " + (d.reason || ""))]; }
    case "comp.save": return [R("", null, (d.route || []).map(r => r.op).join(" → "), "", "", d.wt || "", "", "", "", partyName(S, d.cust), d.partNo, (d.name || "") + " · " + specLabel(d))];
    case "party.save": return [R("", null, (d.roles || []).join(", "), "", "", "", "", "", "", d.name, "", "")];
    case "sched.save": return [R(d.month, d.comp, "", d.del ? 0 : d.qty, "", "", "", "", "", partyName(S, d.cust), "", d.del ? "deleted" : "")];
    case "cfg": return [R("", null, "", "", "", "", "", "", "", "", "", "Settings updated")];
  }
  return [];
}

function sampleEvents(){

  let seed = 20261103;

  const tAt = (dAgo, hr) => T0.getTime() - dAgo * 864e5 + hr * 36e5;
  const raw = []; let n = 0;
  const E = (type, d, t, by) => { raw.push({id:"s" + String(++n).padStart(4, "0"), type, t, by:by || "Om", dev:"sample", d}); };
  const OPS = ["Ramesh", "Suresh", "Mahesh", "Rakesh", "Anil", "Sunil", "Vikram"], INSP = ["Pooja", "Neha", "Kavita"];
  const pickOf = a => a[Math.floor(rnd() * a.length)];

  // ---- masters

  const st = (kind, op, x) => Object.assign({id:"r" + (++n), kind, op}, x || {});
  const comps = {
    p1: {id:"p1", partNo:"40592-02-02", name:"Knob Insert ICOPA", cust:"cA", form:"coil", grade:"CRCA IS513 CR2", thk:1.2, width:85, wt:0.042, pack:500,

    p2: {id:"p2", partNo:"BR-2214", name:"Silencer Mounting Bracket", cust:"cB", form:"coil", grade:"HRPO", thk:3, width:120, wt:0.31, pack:100,
      route:[st("blank", "Blanking", {die:"1020"}), st("press", "Piercing", {die:"1021"}), st("press", "Bending", {die:"1022"}), st("out", "Black zinc plating", {proc:"plating", party:"sPL"}), st("insp", "Inspection & packing")]},
    p3: {id:"p3", partNo:"HP-0871", name:"Hinge Plate", cust:"cA", form:"coil", grade:"CRCA IS513 CR2", thk:2, width:60, wt:0.085, pack:250,
      route:[st("blank", "Blanking", {die:"1030"}), st("out", "Embossing", {proc:"job", party:"sJW"}), st("press", "Piercing", {die:"1031"}), st("out", "Hardening & tempering", {proc:"heat", party:"sHT"}), st("out", "Zinc plating", {proc:"plating", party:"sPL"}), st("insp", "Inspection & packing")]},
    p4: {id:"p4", partNo:"CL-3308", name:"Hose Clip", cust:"cB", form:"coil", grade:"Spring steel CK67", thk:0.8, width:12, wt:0.006, pack:1000,
      route:[st("blank", "Blanking", {die:"1040"}), st("press", "Forming", {die:"1041"}), st("out", "Hardening", {proc:"heat", party:"sHT"}), st("insp", "Inspection & packing")]},
    p5: {id:"p5", partNo:"SC-5120", name:"Spring Clip", cust:"cC", form:"wire", grade:"MS wire", thk:2.5, width:0, wt:0.012, pack:1000,
      route:[st("blank", "Wire cutting", {die:"1050"}), st("press", "Bending", {die:"1051"}), st("out", "Zinc plating", {proc:"plating", party:"sPL"}), st("insp", "Inspection & packing")]},
    p6: {id:"p6", partNo:"LB-1190", name:"Lamp Bracket", cust:"cC", form:"coil", grade:"GI", thk:1, width:95, wt:0.06, pack:200,
      route:[st("out", "Complete part (job work)", {proc:"job", party:"sJW"}), st("insp", "Inspection & packing")]},
  };
  for (const c of Object.values(comps)) E("comp.save", Object.assign({active:true}, c), tAt(25, 10));
  const MC = {p1:["PM-02", "PM-03", "PM-04"], p2:["PM-01", "PM-02", "PM-03"], p3:["PM-02", null, "PM-03"], p4:["PM-04", "PM-04"], p5:["WB-01", "WB-01"]};

  // ---- RM receipts
  const coils = [];
  const GRN = (dAgo, party, doc, form, grade, thk, width, kgs, heat) => {
    const list = kgs.map((k, i) => ({id:"sc-" + doc + "-" + (i + 1), no:doc.replace(/\D/g, "").slice(-4) + "-" + (i + 1), kg:k, heat}));
    E("rm.in", {date:dayKey(tAt(dAgo, 10)), party, doc, form, grade, thk, width, len:0, coils:list}, tAt(dAgo, 10), "Deepak");
    for (const c of list) coils.push(Object.assign({}, c, {form, grade, thk, width, t:tAt(dAgo, 10), rem:c.kg}));
  };
  GRN(21, "sRM", "INV-4471", "coil", "CRCA IS513 CR2", 1.2, 85, [980, 1010, 995], "H24871");
  GRN(21, "sRM", "INV-4472", "coil", "HRPO", 3, 120, [1450, 1480], "H51230");
  GRN(19, "sRM", "INV-4490", "coil", "CRCA IS513 CR2", 2, 60, [650, 620], "H24902");
  GRN(18, "sRM", "INV-4495", "coil", "Spring steel CK67", 0.8, 12, [310, 290], "S8812");
  GRN(17, "sWR", "WT-208", "wire", "MS wire", 2.5, 0, [500, 500, 500], "W3301");
  GRN(13, "sRM", "INV-4532", "coil", "GI", 1, 95, [620, 640], "G7710");
  GRN(6, "sRM", "INV-4580", "coil", "CRCA IS513 CR2", 1.2, 85, [1005, 990], "H25120");
  GRN(2, "sRM", "INV-4611", "coil", "HRPO", 3, 120, [1500], "H51388");

  const consume = (comp, need, t) => {   // returns [{coil, kg, done}]
    const out = [];
    for (const c of coils){
      if (need <= 0.01) break;
      if (c.t > t || c.rem <= 0.5 || !coilMatches(c, comp)) continue;
      const take = Math.min(c.rem, need);
      c.rem -= take; need -= take;
      out.push({coil:c.id, kg:Math.round(take * 10) / 10, done:c.rem <= 0.5});
    }
    return out;
  };

  // ---- lots
  const lotPlan = {p1:[[14, 6000], [11, 6000], [8, 6000], [5, 6000], [2, 6000], [0, 3000]], p2:[[15, 2000], [10, 2000], [6, 2000], [1, 2000]],
    p3:[[13, 4000], [7, 4000], [3, 4000]], p4:[[14, 10000], [9, 10000], [4, 10000], [1, 10000]], p5:[[12, 12000], [8, 12000], [4, 12000], [0, 6000]]};
  let lotN = 0;
  for (const [pid, plan] of Object.entries(lotPlan)){
    const comp = comps[pid];
    plan.forEach(([dAgo, qty], li) => {
      const lotId = "sl-" + pid + "-" + (li + 1);
      const lotNo = yymmdd(new Date(tAt(dAgo, 9))) + "-" + "S" + C32[(++lotN) % 32] + C32[(lotN * 7) % 32];
      let t = tAt(dAgo, 8.5 + rnd() * 3);
      if (t > now - 30 * 60000) t = now - 30 * 60000 - lotN * 60000;
      const route = comp.route;
      // step 0: blanking (one entry per coil used)
      const r0 = rej(qty, 0.2, 0.8), uses = consume(comp, (qty + r0) * comp.wt, t);
      const totalKg = sum(uses, u => u.kg) || 1;
      let okLeft = qty, rejLeft = r0;
      uses.forEach((u, ui) => {
        const share = ui === uses.length - 1 ? 1 : u.kg / totalKg;
        const ok = ui === uses.length - 1 ? okLeft : Math.round(qty * share), rj = ui === uses.length - 1 ? rejLeft : Math.round(r0 * share);
        okLeft -= ok; rejLeft -= rj;
        E("blank", {lot:lotId, lotNo, newLot:ui === 0, route:ui === 0 ? route : undefined, comp:pid, coil:u.coil, kg:u.kg, coilDone:u.done, ok, rej:rj,
          mc:MC[pid][0], die:route[0].die, person:pickOf(OPS), shift:shiftNow(t)}, t + ui * 40 * 60000, "Deepak");
      });
      let avail = qty;
      for (let i = 1; i < route.length; i++){
        const r = route[i];
        if (r.kind === "press"){
          t += (0.35 + rnd() * 0.8) * 864e5;
          if (t > now - 20 * 60000) break;
          const partial = now - t < 0.5 * 864e5;
          const q = partial ? Math.round(avail * 0.55) : avail;
          const rj = rej(q, 0.2, 1.1), rw = (pid === "p2" && li === 2 && i === 2) ? 40 : 0;
          E("op", {lot:lotId, step:i, ok:q - rj - rw, rej:rj, rwk:rw, mc:MC[pid][i] || "", die:r.die || "", person:pickOf(OPS), shift:shiftNow(t)}, t, "Deepak");
          avail = q - rj - rw;
          if (partial) break;
        } else if (r.kind === "out"){
          t += (0.15 + rnd() * 0.4) * 864e5;
          if (t > now - 20 * 60000) break;
          E("out.send", {party:r.party, doc:"DC-" + (3100 + n), veh:"HR-51-" + (1000 + Math.floor(rnd() * 8999)), lines:[{lot:lotId, step:i, qty:avail}]}, t, "Deepak");
          t += (1.6 + rnd() * 2.6) * 864e5;
          if (t > now - 20 * 60000) break;
          const rj = rej(avail, 0.3, 1.8);
          E("out.recv", {party:r.party, doc:"PD-" + (700 + n), lines:[{lot:lotId, step:i, ok:avail - rj, rej:rj}]}, t, "Deepak");
          avail -= rj;
        } else if (r.kind === "insp"){
          t += (0.2 + rnd() * 0.7) * 864e5;
          if (t > now - 20 * 60000) break;
          const rj = rej(avail, 0.3, 1.4), ok = avail - rj;
          E("insp", {lot:lotId, step:i, ok, rej:rj, rwk:0, boxes:Math.ceil(ok / comp.pack), person:pickOf(INSP)}, t, "Deepak");
          avail = ok;
        }
      }
    });
  }
  // fully outsourced part: RM issued to job worker
  [[10, 3000], [5, 3000]].forEach(([dAgo, qty], li) => {
    const comp = comps.p6, lotId = "sl-p6-" + (li + 1), lotNo = yymmdd(new Date(tAt(dAgo, 9))) + "-SJ" + (li + 1);
    const t = tAt(dAgo, 11), u = consume(comp, qty * comp.wt, t)[0] || {};
    E("out.send", {party:"sJW", doc:"DC-" + (3300 + li), veh:"HR-38-" + (2200 + li * 37), lines:[{lot:lotId, lotNo, newLot:true, comp:"p6", route:comp.route, step:0, qty, coil:u.coil, kg:u.kg}]}, t, "Deepak");
    const t2 = t + (3.5 + li) * 864e5;
    if (t2 < now - 20 * 60000){
      const rj = rej(qty, 0.5, 1.5);
      E("out.recv", {party:"sJW", doc:"SPW-" + (440 + li), lines:[{lot:lotId, step:0, ok:qty - rj, rej:rj}]}, t2, "Deepak");
      const t3 = t2 + 0.5 * 864e5;
      if (t3 < now - 20 * 60000){ const r2 = rej(qty - rj, 0.3, 1); E("insp", {lot:lotId, step:1, ok:qty - rj - r2, rej:r2, rwk:0, boxes:Math.ceil((qty - rj - r2) / comp.pack), person:pickOf(INSP)}, t3, "Deepak"); }
    }
  });
  // ---- schedules (previous + current month)
  const mk = monthKey(new Date(now)), pmk = addMonths(mk, -1);
  const SQ = {p1:30000, p2:8000, p3:12000, p4:40000, p5:48000, p6:6000};
  for (const [pid, q] of Object.entries(SQ)){
    E("sched.save", {id:"ss-" + pmk + "-" + pid, month:pmk, cust:comps[pid].cust, comp:pid, qty:q}, tAt(28, 9));
    E("sched.save", {id:"ss-" + mk + "-" + pid, month:mk, cust:comps[pid].cust, comp:pid, qty:q, weeks:[Math.round(q * .25), Math.round(q * .25), Math.round(q * .25), q - 3 * Math.round(q * .25), 0]}, tAt(Math.min(3, new Date(now).getDate() - 1), 9));
  }

  const toEvents = list => list.slice().sort((a, b) => a.t - b.t).map(x => ({id:x.id, type:x.type, ts:new Date(x.t).toISOString(), by:x.by, dev:x.dev, d:x.d}));
  // ---- today's press activity: work on whatever is waiting at a press step
  {
    const S0 = buildState(toEvents(raw));
    const waiting = lotsWaiting(S0, ["press"]).filter(w => w.qty > 300).slice(-4);
    waiting.forEach((w, j) => {
      const t = Math.max(T0.getTime() + 6.5 * 36e5, now - (1 + j * 0.8) * 36e5, new Date(w.lot.lastTs).getTime() + 30 * 60000);
      if (t > now - 10 * 60000) return;
      const comp = comps[w.lot.comp], q = Math.round(w.qty * (0.4 + rnd() * 0.3)), rj = rej(q, 0.2, 0.9);
      E("op", {lot:w.lot.id, step:w.i, ok:q - rj, rej:rj, rwk:0, mc:(MC[w.lot.comp] || [])[w.i] || "", die:comp.route[w.i].die || "", person:pickOf(OPS), shift:shiftNow(t)}, t, "Deepak");
    });
  }
  // ---- die setups: whenever a machine switches part/operation
  {
    const prod = raw.filter(x => (x.type === "blank" || x.type === "op") && x.d.mc).sort((a, b) => a.t - b.t);
    const cur = {};
    for (const x of prod){
      const step = x.type === "blank" ? 0 : x.d.step, lot = x.d.lot;
      const comp = x.d.comp || (Object.values(comps).find(c => lot.indexOf("sl-" + c.id + "-") === 0) || {}).id;
      const k = comp + "|" + step;
      if (cur[x.d.mc] === k) continue;
      cur[x.d.mc] = k;
      const c = comps[comp];
      E("setup", {mc:x.d.mc, die:c.route[step].die || "", comp, step, opName:c.route[step].op, person:"Rajesh"}, x.t - 25 * 60000, "Rajesh");
    }
  }
  // ---- dispatches: replay state at each dispatch time and ship most of the FG (FIFO)
  let inv = 1180;
  for (const [dAgo, hr] of [[13, 17], [11, 17], [9, 17], [7, 17], [5, 17], [3, 17], [1, 17], [0, 11.5]]){
    const t = tAt(dAgo, hr);
    if (t > now - 10 * 60000) continue;
    const S = buildState(toEvents(raw.filter(x => x.t <= t)));
    for (const cust of ["cA", "cB", "cC"]){
      const lines = [], taken = new Map();
      for (const c of Object.values(comps)){
        if (c.cust !== cust) continue;
        const fg = fgOf(S, c.id); if (fg < c.pack) continue;
        const q = Math.floor(fg * (0.75 + rnd() * 0.25) / c.pack) * c.pack; if (q <= 0) continue;
        const a = allocFIFO(S, c.id, q, taken); lines.push({comp:c.id, qty:q, alloc:a.alloc});
      }
      if (lines.length) E("disp", {cust, inv:"INV/26-27/" + (++inv), veh:"HR-55-" + (4000 + Math.floor(rnd() * 5000)), date:dayKey(t), lines}, t + (cust === "cB" ? 30 : cust === "cC" ? 60 : 0) * 60000, "Deepak");
    }
  }
  return toEvents(raw);
}

/* ---------- toast ---------- */
let _toastT = null;
function toast(msg, kind){
  const t = $("#toast"); if (!t) return;
  t.textContent = msg; t.className = "toast show " + (kind || "");
  clearTimeout(_toastT); _toastT = setTimeout(() => { t.className = "toast " + (kind || ""); }, 2600);

/* ---------- layers + Android back button ----------
   One "guard" history entry sits on top while any layer is open, so the phone's Back
   button closes the top layer instead of leaving the app. */
const LAYERS = [];
let IGNORE_POP = 0, GUARD = false;
function pushGuard(){ if (GUARD) return; try { history.pushState({ptGuard:1}, ""); GUARD = true; } catch (e) {} }
function pushLayer(el, onClose){
  $("#layers").appendChild(el);
  LAYERS.push({el, onClose});
  pushGuard();
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("in")));
  document.body.style.overflow = "hidden";
  document.body.classList.add("has-layer");
}
function closeTop(fromPop){
  const L = LAYERS.pop(); if (!L) return;
  L.el.classList.remove("in");
  setTimeout(() => L.el.remove(), 220);
  if (!LAYERS.length){ document.body.style.overflow = ""; document.body.classList.remove("has-layer"); }
  if (L.onClose) try { L.onClose(); } catch (e) {}
  if (!fromPop && !LAYERS.length){
    setTimeout(() => { if (!LAYERS.length && GUARD){ GUARD = false; IGNORE_POP++; try { history.back(); } catch (e){ IGNORE_POP--; } } }, 80);
  }
}
function closeAll(){ while (LAYERS.length) closeTop(); }
window.addEventListener("popstate", () => {
  if (IGNORE_POP > 0){ IGNORE_POP--; return; }
  GUARD = false;
  if (LAYERS.length){ closeTop(true); if (LAYERS.length) pushGuard(); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && LAYERS.length) closeTop(); });

function openSheet(o){
  const el = document.createElement("div");
  el.className = "layer";
  el.innerHTML = '<div class="bk" data-act="close-top"></div><section class="sheet ' + (o.cls || "") + '" role="dialog" aria-modal="true" aria-label="' + esc(o.title) + '">' +
    '<header class="sh-h"><button class="sh-x" data-act="close-top" aria-label="Back" type="button">' + ic("back") + '</button>' +
    '<div class="sh-t"><div class="sh-title">' + esc(o.title) + '</div>' + (o.hi ? '<div class="sh-hi">' + esc(o.hi) + '</div>' : "") + '</div>' + (o.headR || "") + '</header>' +
    '<div class="sh-b">' + (o.body || "") + '</div>' + (o.foot ? '<footer class="sh-f">' + o.foot + '</footer>' : "") + '</section>';
  pushLayer(el, o.onClose);

}

function pick(o){
  const el = document.createElement("div");
  el.className = "layer";
  const items = o.items || [];
  el.innerHTML = '<div class="bk" data-act="close-top"></div><section class="pick" role="dialog" aria-modal="true" aria-label="' + esc(o.title) + '">' +

    '<div class="pick-list"></div></section>';
  const list = $(".pick-list", el), inp = $("input", el);
  const draw = () => {
    const q = inp ? norm(inp.value) : "";

    if (o.add) html += '<button class="pick-it" data-i="add" type="button"><div class="l-ico pick-add">' + ic("plus") + '</div><div class="p-main"><div class="p-t pick-add">' + esc(o.add) + '</div></div></button>';
    items.forEach((it, i) => {
      if (q && !norm([it.t, it.s, it.kw].join(" ")).includes(q)) return;
      if (it.g && it.g !== g){ g = it.g; html += '<div class="pick-g">' + esc(g) + '</div>'; }
      n++;
      html += '<button class="pick-it ' + (it.v === o.value ? "sel " : "") + (it.dis ? "dis" : "") + '" data-i="' + i + '" type="button">' + (it.ico || "") +
        '<div class="p-main"><div class="p-t">' + esc(it.t) + '</div>' + (it.s ? '<div class="p-s">' + esc(it.s) + '</div>' : "") + '</div>' + (it.b || "") + '</button>';
    });
    if (!n) html += '<div class="empty">' + esc(o.empty || "Nothing found") + (o.emptyHi ? '<span class="hi">' + esc(o.emptyHi) + '</span>' : "") + '</div>';
    list.innerHTML = html;
  };
  draw();

  });
  pushLayer(el);
  if (inp && items.length > 12 && window.matchMedia("(min-width: 900px)").matches) setTimeout(() => inp.focus(), 60);
}

/* ---------- dialogs ---------- */
function dialog(o){
  return new Promise(resolve => {
    const el = document.createElement("div");
    el.className = "layer";
    el.innerHTML = '<div class="bk"></div><div class="dlg" role="alertdialog" aria-modal="true"><h3>' + esc(o.title) + '</h3>' + (o.msg ? '<p>' + o.msg + '</p>' : "") +
      (o.input ? '<input class="in ' + (o.input.cls || "") + '" type="' + (o.input.type || "text") + '" ' + (o.input.mode ? 'inputmode="' + o.input.mode + '"' : "") + ' placeholder="' + esc(o.input.ph || "") + '" value="' + esc(o.input.value || "") + '" autocomplete="off">' : "") +
      '<div class="dlg-a">' + (o.cancel === false ? "" : '<button class="btn btn-ghost" data-r="0" type="button">' + esc(o.cancel || "Cancel") + '</button>') +
      '<button class="btn ' + (o.danger ? "btn-danger" : "btn-primary") + '" data-r="1" type="button">' + esc(o.ok || "OK") + '</button></div></div>';
    let done = false;
    const finish = v => { if (done) return; done = true; closeTop(); resolve(v); };
    el.addEventListener("click", e => {
      const b = e.target.closest("[data-r]"); if (!b) return;
      if (b.dataset.r === "1") finish(o.input ? $("input", el).value : true); else finish(o.input ? null : false);
    });
    pushLayer(el, () => { if (!done){ done = true; resolve(o.input ? null : false); } });
    const inp = $("input", el);
    if (inp){ setTimeout(() => inp.focus(), 80); inp.addEventListener("keydown", e => { if (e.key === "Enter") finish(inp.value); }); }
  });
}

function setPath(o, path, v){ const ks = path.split("."); let x = o; for (let i = 0; i < ks.length - 1; i++){ if (x[ks[i]] == null) x[ks[i]] = {}; x = x[ks[i]]; } x[ks[ks.length - 1]] = v; }

/* A form = state object F + body(F) + foot(F) + actions. Inputs with data-bind write into F. */
function formSheet(def){
  const F = def.F || {};
  const el = openSheet({title:def.title, hi:def.hi, body:"", foot:"<div></div>", cls:"form " + (def.cls || "")});
  el._form = true;
  const body = $(".sh-b", el), foot = $(".sh-f", el);
  F.redraw = () => {
    const st = body.scrollTop;
    body.innerHTML = def.body(F);
    body.scrollTop = st;
    F.refoot();
  };
  F.refoot = () => {
    foot.innerHTML = (def.summary ? '<div class="f-sum">' + (def.summary(F) || "&nbsp;") + '</div>' : "") +
      '<button class="btn btn-primary btn-block btn-lg" data-fa="save" type="button">' + esc(def.saveLabel || "Save · सेव करें") + '</button>';
  };
  F.close = () => closeTop();
  F.el = el;
  el.addEventListener("input", e => {
    const t = e.target; if (!t.dataset || !t.dataset.bind) return;
    setPath(F, t.dataset.bind, t.type === "checkbox" ? t.checked : t.value);
    if (def.changed) def.changed(F, t.dataset.bind, t);
    if (def.summary) { const s = $(".f-sum", foot); if (s) s.innerHTML = def.summary(F) || "&nbsp;"; }
  });
  el.addEventListener("change", e => {
    const t = e.target; if (!t.dataset || !t.dataset.bind) return;
    if (t.tagName === "SELECT" || t.type === "checkbox" || t.type === "date"){
      setPath(F, t.dataset.bind, t.type === "checkbox" ? t.checked : t.value);
      if (def.changed) def.changed(F, t.dataset.bind, t, true);
    }
  });
  el.addEventListener("click", async e => {
    const b = e.target.closest("[data-fa]"); if (!b || !el.contains(b)) return;
    const a = b.dataset.fa;
    if (a === "seg"){ setPath(F, b.dataset.bind, b.dataset.v); if (def.changed) def.changed(F, b.dataset.bind, b, true); F.redraw(); return; }
    if (a === "save"){
      if (F._saving) return;
      F._saving = true;
      try { const r = await def.save(F); if (r !== false) { /* saved */ } } catch (err){ console.error(err); toast(String(err.message || err), "bad"); }
      finally { F._saving = false; }
      return;
    }
    const fn = def.act && def.act[a];
    if (fn) fn(F, b.dataset, b);
  });
  F.redraw();
  if (def.mounted) def.mounted(F);
  return F;
}

function niceMax(v){ if (v <= 0) return 1; const e = Math.pow(10, Math.floor(Math.log10(v))), f = v / e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e; }

function trendChart(days){
  const W = 680, H = 210, pl = 40, pr = 6, pt = 10, pb = 24;
  const vals = days.map(d => d.blank + d.press);
  const max = niceMax(Math.max(...vals, 1)), n = days.length, bw = (W - pl - pr) / n, barW = Math.min(24, bw * 0.6), ih = H - pt - pb;

  days.forEach((d, i) => {
    const v = vals[i], h = v / max * ih, x = pl + i * bw + (bw - barW) / 2, yb = H - pb, y = yb - h, r = Math.min(4, h, barW / 2);

    const dt = dateOnly(d.dk);
    const tip = "<b>" + fmtD(dt) + (isToday ? " (today)" : "") + "</b><br>" + n0(v) + " pcs · blanking " + n0(d.blank) + " · operations " + n0(d.press) + "<br>Dispatched " + n0(d.disp);
    g += '<g class="col" data-tip="' + esc(tip) + '"><rect class="hit" x="' + (pl + i * bw) + '" y="' + pt + '" width="' + bw + '" height="' + (ih + pb) + '"/>' + (path ? '<path class="bar' + (isToday ? "" : "") + '" d="' + path + '"/>' : "") + '</g>';
    if (n <= 10 || i % 2 === (n - 1) % 2) g += '<text class="ax" x="' + (pl + i * bw + bw / 2) + '" y="' + (H - 7) + '" text-anchor="middle">' + pad2(dt.getDate()) + '</text>';

}

function viewTrack(){

  const all = [...S.lots.values()];
  const counts = {open:0, plant:0, out:0, insp:0, fg:0, closed:0};
  for (const l of all){
    if (l.status !== "closed") counts.open++;
    if (l.status === "closed") counts.closed++;
    for (const st of ["plant", "out", "insp", "fg"]) if (l.bk.some(b => b.stage === st)) counts[st]++;
  }
  const F = [["open", "Open", "चालू"], ["plant", "Press shop", ""], ["out", "At suppliers", ""], ["insp", "Inspection", ""], ["fg", "FG ready", ""], ["closed", "Closed", ""]];

  if (!list.length) h += '<div class="empty">' + (all.length ? "No lots here." : "No lots yet — they are created at blanking.") + '<span class="hi">' + (all.length ? "कोई लॉट नहीं" : "लॉट ब्लैंकिंग से बनते हैं") + '</span>' + (all.length ? "" : '<br><button class="btn btn-primary" data-act="new" data-f="blank" type="button">' + ic("blank") + 'Record blanking</button>') + '</div>';

  h += '<div class="box"><div class="box-h">Route & quantities · रूट</div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Step</th>' + cols.map(c => '<th class="r">' + c[1] + '</th>').join("") + '</tr></thead><tbody>' +

    h += '<div class="box"><div class="box-h">Traceability · ट्रेसबिलिटी</div>' + lot.coils.map(x => {

    }).join("") + '</div>';
  }
  if (lot.dispList.length) h += '<div class="box"><div class="box-h">Dispatches · डिस्पैच</div>' + lot.dispList.map(d => '<div class="lrow"><span class="l-ico" style="color:var(--st-fg)">' + ic("disp") + '</span><span class="l-main"><span class="l-t" style="display:block">' + esc(partyName(S, d.cust)) + '</span><span class="l-s" style="display:block">Invoice ' + esc(d.inv || "—") + ' · ' + fmtDayKey(d.date) + '</span></span><span class="l-r">' + n0(d.qty) + '<small>pcs</small></span></div>').join("") + '</div>';

function evTouchesLot(e, lotId){
  const d = e.d || {};
  if (d.lot === lotId) return true;
  if (Array.isArray(d.lines)) return d.lines.some(l => l.lot === lotId || (l.alloc || []).some(a => a.lot === lotId));
  return false;
}
function tlItem(S, lot, e){
  const d = e.d || {}, v = isVoid(S, e);
  const L = (d.lines || []).find(l => l.lot === lot.id) || {};
  const step = d.step != null ? +d.step : L.step != null ? +L.step : 0;
  const op = stepName(lot, step);
  let t = "", s = "", k = (EV[e.type] || {}).st || "";
  switch (e.type){
    case "blank": { const co = S.coils.get(d.coil); t = op + " — " + n0(d.ok) + " OK" + (+d.rej ? " · " + n0(d.rej) + " rej" : ""); s = [kg(d.kg) + (co ? " from coil " + co.no : ""), d.coilDone ? "coil finished" : "", d.mc, d.die ? "die " + d.die : "", d.person, d.shift ? "shift " + d.shift : ""].filter(Boolean).join(" · "); break; }
    case "op": t = op + " — " + n0(d.ok) + " OK" + (+d.rej ? " · " + n0(d.rej) + " rej" : "") + (+d.rwk ? " · " + n0(d.rwk) + " rework" : ""); s = [d.mc, d.die ? "die " + d.die : "", d.person, d.shift ? "shift " + d.shift : ""].filter(Boolean).join(" · "); break;
    case "rwk": t = "Rework result (" + op + ") — " + n0(d.ok) + " OK" + (+d.rej ? " · " + n0(d.rej) + " scrap" : ""); s = d.person || ""; break;
    case "out.send": t = "Sent to " + partyName(S, d.party) + " — " + n0(L.qty) + " pcs"; s = [op, d.doc ? "DC " + d.doc : "", L.kg ? kg(L.kg) + " RM issued" : "", d.veh].filter(Boolean).join(" · "); break;
    case "out.recv": t = "Received from " + partyName(S, d.party) + " — " + n0(L.ok) + " OK" + (+L.rej ? " · " + n0(L.rej) + " rej/short" : ""); s = [op, d.doc ? "their DC " + d.doc : ""].filter(Boolean).join(" · "); break;
    case "insp": t = "Inspection — " + n0(d.ok) + " OK" + (+d.rej ? " · " + n0(d.rej) + " rej" : "") + (+d.rwk ? " · " + n0(d.rwk) + " rework" : ""); s = [d.person, +d.boxes ? d.boxes + " boxes" : ""].filter(Boolean).join(" · "); k = "insp"; break;
    case "disp": { const q = sum((d.lines || []).flatMap(l => (l.alloc || []).filter(a => a.lot === lot.id)), a => a.qty); t = "Dispatched " + n0(q) + " pcs to " + partyName(S, d.cust); s = "Invoice " + (d.inv || "—") + (d.veh ? " · " + d.veh : ""); k = "fg"; break; }
    default: t = (EV[e.type] || {en:e.type}).en;
  }
  const vb = v ? S.voidBy.get(e.id) : null;
  return '<div class="tl-it tk-' + k + (v ? " void" : "") + '"><div class="tl-top"><span>' + fmtDT(e.ts) + '</span><span>' + esc(e.by || "") + (!DB.ids.has(e.id) && MODE === "online" ? " ⏳" : "") + '</span></div><div class="tl-t">' + esc(t) + '</div>' +
    (s ? '<div class="tl-s">' + esc(s) + '</div>' : "") + (v ? '<div class="tl-s" style="color:#f08a7c">Cancelled' + (vb && vb.d.reason ? ": " + esc(vb.d.reason) : "") + '</div>' : '<button class="link" style="font-size:12px;margin-top:4px;color:var(--ink-faint)" data-act="void" data-id="' + esc(e.id) + '" type="button">Cancel entry</button>') + '</div>';
}
function nextAction(S, lot){
  const b = lot.bk.find(x => x.stage !== "fg");
  if (!b){ if (lot.fg > 0) return {f:"disp", t:"Dispatch " + n0(lot.fg) + " pcs", ic:"disp"}; return null; }
  const op = stepName(lot, b.i);
  if (b.type === "rwk") return {f:"rwk", t:"Record rework result · " + op, ic:"rwk", i:b.i};
  if (b.type === "sup") return {f:"recv", t:"Receive back from " + (partyName(S, b.party) || "supplier"), ic:"in", i:b.i};
  if (b.type === "ready") return {f:"send", t:"Send for " + op, ic:"out", i:b.i};
  const k = lot.route[b.i].kind;
  if (k === "insp") return {f:"insp", t:"Record inspection", ic:"insp", i:b.i};
  return {f:"op", t:"Record " + op, ic:"press", i:b.i};
}

    h += '<div class="sec-h">Used in lots · किन लॉट में गई</div><div class="panel" style="padding:4px 12px">' + (co.uses.length ? co.uses.map(u => { const l = S.lots.get(u.lot); return '<button class="lrow" data-act="lot" data-id="' + esc(u.lot) + '" type="button"><span class="l-main"><span class="l-t" style="display:block">Lot ' + esc(l ? l.no : u.lot) + '</span><span class="l-s" style="display:block">' + esc(l ? compLabel(S, l.comp) : "") + ' · ' + fmtD(u.ts) + '</span></span><span class="l-r">' + kg(u.kg) + '</span></button>'; }).join("") : '<div class="empty">Not used yet</div>') + '</div>';

  }});

/* ---------- PLAN ---------- */
function viewPlan(){
  const S = STATE, mk = UI.planMonth, rows = schedRows(S, mk);
  const tq = sum(rows, r => r.qty), ts = sum(rows, r => r.sent), td = sum(rows, r => r.due);
  let h = '<div class="row" style="justify-content:space-between;margin-bottom:12px"><div class="row"><button class="icon-b" data-act="plan-m" data-d="-1" type="button" aria-label="Previous month">' + ic("back") + '</button>' +
    '<div style="min-width:120px;text-align:center"><div style="font-size:17px;font-weight:800">' + monthLabel(mk) + '</div><div class="faint" style="font-size:11px">schedule vs dispatch</div></div>' +
    '<button class="icon-b" data-act="plan-m" data-d="1" type="button" aria-label="Next month" style="transform:scaleX(-1)">' + ic("back") + '</button></div>' +
    '<div class="row"><button class="btn d-only" data-act="sched-new" type="button">' + ic("plus") + 'Schedule line</button><button class="btn btn-primary" data-act="new" data-f="disp" type="button">' + ic("disp") + 'Dispatch</button></div></div>';
